                                  type="tel"
                                  value={newStudent.phone}
                                  onChange={(e) =>
                                    setNewStudent({ ...newStudent, phone: e.target.value })
                                  }
                                  required
                                  placeholder="e.g., 9876543210"
                                />
                              </div>
                              <div className="field">
                                <label htmlFor="student-name">Full name</label>
                                <input
                                  id="student-name"
                                  type="text"
                                  value={newStudent.name}
                                  onChange={(e) =>
                                    setNewStudent({ ...newStudent, name: e.target.value })
                                  }
                                  required
                                  placeholder="e.g., Ravi Kumar"
                                />
                              </div>
                              <div className="field field--full">
                                <label htmlFor="student-school">School / college</label>
                                <input
                                  id="student-school"
                                  type="text"
                                  value={newStudent.school}
                                  onChange={(e) =>
                                    setNewStudent({ ...newStudent, school: e.target.value })
                                  }
                                  placeholder="e.g., XYZ College"
                                />
                              </div>
                              <div className="field">
                                <label htmlFor="student-degree">Degree / class</label>
                                <input
                                  id="student-degree"
                                  type="text"
                                  value={newStudent.degree}
                                  onChange={(e) =>
                                    setNewStudent({ ...newStudent, degree: e.target.value })
                                  }
                                  placeholder="e.g., B.Tech, 12th, 10th"
                                />
                              </div>
                              <div className="field">
                                <label htmlFor="student-year">Year</label>
                                <input
                                  id="student-year"
                                  type="number"
                                  value={newStudent.year}
                                  onChange={(e) =>
                                    setNewStudent({
                                      ...newStudent,
                                      year: parseInt(e.target.value) || 0
                                    })
                                  }
                                />
                              </div>
                              <div className="field">
                                <label htmlFor="student-income">Annual income (₹)</label>
                                <input
                                  id="student-income"
                                  type="number"
                                  min="0"
                                  value={newStudent.annual_income}
                                  onChange={(e) =>
                                    setNewStudent({
                                      ...newStudent,
                                      annual_income: parseFloat(e.target.value) || 0
                                    })
                                  }
                                />
                              </div>
                              <div className="field field--select">
                                <label htmlFor="student-category">Category</label>
                                <select
                                  id="student-category"
                                  value={newStudent.category}
                                  onChange={(e) =>
                                    setNewStudent({ ...newStudent, category: e.target.value })
                                  }
                                >
                                  <option value="GENERAL">General</option>
                                  <option value="GENERAL_GIRLS">General Girls</option>
                                  <option value="SC">SC</option>
                                  <option value="ST">ST</option>
                                  <option value="OBC">OBC</option>
                                  <option value="SOCIAL_SC">Social SC</option>
                                  <option value="SOCIAL_PWD">PWD</option>
                                </select>
                              </div>
                              <div className="field field--full">
                                <label htmlFor="student-disability">Disability percentage (%)</label>
                                <input
                                  id="student-disability"
                                  type="number"
                                  min="0"
                                  max="100"
                                  value={newStudent.disability_pct}
                                  onChange={(e) =>
                                    setNewStudent({
                                      ...newStudent,
                                      disability_pct: parseInt(e.target.value) || 0
                                    })
                                  }
                                />
                              </div>
                            </div>
                            <button type="submit" className="btn-solid" disabled={loading}>
                              {loading ? 'Registering…' : 'Register student'} <i>↗</i>
                            </button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className={'acc-item' + (openPanel === 'scholarship' ? ' is-open' : '')}>
                    <button
                      type="button"
                      className="acc-head"
                      onClick={() =>
                        setOpenPanel(openPanel === 'scholarship' ? '' : 'scholarship')
                      }
                      aria-expanded={openPanel === 'scholarship'}
                      aria-controls="panel-scholarship"
                    >
                      <span className="cap acc-index">02</span>
                      <span className="acc-title">Add scholarship</span>
                      <span className="acc-meta">Extend the catalogue with a new scheme</span>
                      <span className="acc-plus" aria-hidden="true">
                        <i></i>
                        <i></i>
                      </span>
                    </button>
                    <div className="acc-body" id="panel-scholarship">
                      <div className="acc-body-inner">
                        <div className="acc-content">
                          <form onSubmit={handleCreateScholarship}>
                            <div className="form-grid">
                              <div className="field field--full">
                                <label htmlFor="scholarship-name">Scholarship name</label>
                                <input
                                  id="scholarship-name"
                                  type="text"
                                  value={newScholarship.name}
                                  onChange={(e) =>
                                    setNewScholarship({
                                      ...newScholarship,
                                      name: e.target.value
                                    })
                                  }
                                  required
                                  placeholder="e.g., Central Sector Scheme"
                                />
                              </div>
                              <div className="field field--full">
                                <label htmlFor="scholarship-org">Organization</label>
                                <input
                                  id="scholarship-org"
                                  type="text"
                                  value={newScholarship.org}
                                  onChange={(e) =>
                                    setNewScholarship({ ...newScholarship, org: e.target.value })
                                  }
                                  required
                                  placeholder="e.g., MHRD / AICTE"
                                />
                              </div>
                              <div className="field field--select">
                                <label htmlFor="scholarship-category">Category</label>
                                <select
                                  id="scholarship-category"
                                  value={newScholarship.category}
                                  onChange={(e) =>
                                    setNewScholarship({
                                      ...newScholarship,
                                      category: e.target.value
                                    })
                                  }
                                >
                                  <option value="CENTRAL_GENERAL">Central General</option>
                                  <option value="STATE_GENERAL">State General</option>
                                  <option value="GENERAL_GIRLS">General Girls</option>
                                  <option value="SOCIAL_SC">Social SC</option>
                                  <option value="SOCIAL_ST">Social ST</option>
                                  <option value="SOCIAL_PWD">PWD</option>
                                  <option value="SCIENCE_RESEARCH">Science Research</option>
                                </select>
                              </div>
                              <div className="field">
                                <label htmlFor="scholarship-deadline">Deadline</label>
                                <input
                                  id="scholarship-deadline"
                                  type="date"
                                  value={newScholarship.deadline}
                                  onChange={(e) =>
                                    setNewScholarship({
                                      ...newScholarship,
                                      deadline: e.target.value
                                    })
                                  }
                                />
                              </div>
                              <div className="field field--full">
                                <label htmlFor="scholarship-criteria">Eligibility criteria</label>
                                <textarea
                                  id="scholarship-criteria"
                                  value={newScholarship.eligibility_criteria}
                                  onChange={(e) =>
                                    setNewScholarship({
                                      ...newScholarship,
                                      eligibility_criteria: e.target.value
                                    })
                                  }
                                  rows="3"
                                  placeholder="e.g., Class 12 pass. Min 80% aggregate. Family annual income < INR 4.5 lakh."
                                />
                              </div>
                              <div className="field field--full">
                                <label htmlFor="scholarship-documents">Documents required</label>
                                <input
                                  id="scholarship-documents"
                                  type="text"
                                  value={newScholarship.documents}
                                  onChange={(e) =>
                                    setNewScholarship({
                                      ...newScholarship,
                                      documents: e.target.value
                                    })
                                  }
                                  placeholder="e.g., income_certificate, marksheets, etc."
                                />
                              </div>
                              <div className="field field--full">
                                <label htmlFor="scholarship-url">Website URL</label>
                                <input
                                  id="scholarship-url"
                                  type="url"
                                  value={newScholarship.url}
                                  onChange={(e) =>
                                    setNewScholarship({ ...newScholarship, url: e.target.value })
                                  }
                                  placeholder="e.g., https://scholarships.gov.in"
                                />
                              </div>
                            </div>
                            <button type="submit" className="btn-solid" disabled={loading}>
                              {loading ? 'Adding…' : 'Add scholarship'} <i>↗</i>
                            </button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section className="section" id="match">
                <div className="section-head">
                  <div className="section-caption">
                    <span className="cap">
                      <b>04</b> — Eligibility engine
                    </span>
                  </div>
                  <h2 className="h2 split-head" aria-label="Match a profile.">
                    <span className="word-mask" style={{ '--i': 0 }} aria-hidden="true">
                      <span>Match</span>
                    </span>{' '}
                    <span className="word-mask" style={{ '--i': 1 }} aria-hidden="true">
                      <span>a</span>
                    </span>
                    <br />
                    <span className="word-mask" style={{ '--i': 2 }} aria-hidden="true">
                      <span>profile.</span>
                    </span>
                  </h2>
                  <p className="section-note">
                    Select a registered student and run the engine. Results return ranked by
                    eligibility score, with the scheme's own rules attached.
                  </p>
                </div>

                {students.length === 0 ? (
                  <div className="empty">
                    <span className="empty-index">00</span>
                    <p>No student profiles yet. Register a student above to run a match.</p>
                  </div>
                ) : (
                  <div className="match-controls">
                    <div className="field field--select">
                      <label htmlFor="student-select">Select student</label>
                      <select
                        id="student-select"
                        value={selectedStudent}
                        onChange={(e) => setSelectedStudent(e.target.value)}
                      >
                        <option value="">— Select a student —</option>
                        {students.map((s) => (
                          <option key={s.id} value={s.id}>
                            {s.name} ({s.phone})
                          </option>
                        ))}
                      </select>
                    </div>
                    <button
                      type="button"
                      className="btn-solid"
                      onClick={getRecommendations}
                      disabled={loading || !selectedStudent}
                    >
                      {loading ? 'Checking…' : 'Get recommendations'} <i>↗</i>
                    </button>
                  </div>
                )}

                {recommendations.length === 0 ? (
                  <div className="empty">
                    <span className="empty-index">—</span>
                    <p>
                      Nothing ranked yet. Choose a student, run the engine, and the strongest
                      matches will appear here in order.
                    </p>
                  </div>
                ) : (
                  <div className="rank-list">
                    {recommendations.map((rec, idx) => {
                      const details = rec.details || {};
                      const score = Math.round(rec.score || 0);
                      return (
                        <article
                          key={idx}
                          className="rank-row"
                          data-reveal
                          style={{ '--i': Math.min(idx, 6) }}
                        >
                          <span className="cap rank-num">{pad2(idx + 1)}</span>
                          <div className="rank-main">
                            <h3 className="rank-name">{details.name || 'Scholarship'}</h3>
                            <div className="rank-meta">
                              {[details.org, details.deadline, (details.category || '').replace(/_/g, ' ')]
                                .filter(Boolean)
                                .join(' · ')}
                            </div>
                            {details.eligibility_criteria && (
                              <p className="rank-criteria">{details.eligibility_criteria}</p>
                            )}
                            <div className="score-bar" style={{ '--w': score + '%' }}>
                              <span></span>
                            </div>
                            <div className="rank-meta">{getScoreLabel(score)}</div>
                          </div>
                          <div className="rank-score">
                            {score}
                            <em>%</em>
                          </div>
                          {details.url ? (
                            <a
                              className="rank-link"
                              href={details.url}
                              target="_blank"
                              rel="noreferrer"
                              aria-label={'Open ' + (details.name || 'scholarship')}
                            >
                              ↗
                            </a>
                          ) : (
                            <span className="rank-link" aria-hidden="true">
                              ↗
                            </span>
                          )}
                        </article>
                      );
                    })}
                  </div>
                )}
              </section>
            </main>

            <footer className="site-footer">
              <p className="footer-big">
                <span className="line-mask" style={{ '--d': 0 }}>
                  <span>Register.</span>
                </span>
                <span className="line-mask" style={{ '--d': 1 }}>
                  <span>Match. Apply.</span>
                </span>
              </p>

              <div className="footer-meta">
                <div>
                  <span className="cap">Workspace</span>
                  <p>Student and scholarship management</p>
                </div>
                <div>
                  <span className="cap">Records</span>
                  <p>
                    {pad2(students.length)} students / {pad2(scholarships.length)} schemes
                  </p>
                </div>
                <div>
                  <span className="cap">Sections</span>
                  <p>Overview / Index / Register / Match</p>
                </div>
                <div>
                  <span className="cap">Source</span>
                  <a href="https://github.com/jaynagda06/-Scholarship-Eligibility-Assistant" target="_blank" rel="noreferrer">
                    GitHub ↗
                  </a>
                </div>
              </div>

              <div className="footer-legal">
                <span>Scholarship Eligibility Assistant</span>
                <span>Eligibility scoring is advisory, not an award decision.</span>
              </div>
            </footer>

            <nav className="section-nav" data-surface={surface.bottom} aria-label="Section navigation">
              {SECTIONS.map((s) => (
                <a
                  key={s.id}
                  href={'#' + s.id}
                  className={activeSection === s.id ? 'is-active' : ''}
                  onClick={(e) => {
                    e.preventDefault();
                    scrollToId(s.id);
                  }}
                >
                  {s.label} <i></i>
                </a>
              ))}
            </nav>

            <button
              type="button"
              className="invert-btn"
              data-surface={surface.bottom}
              onClick={toggleInvert}
              aria-pressed={inverted}
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="6.5" stroke="currentColor" />
                <path d="M8 1.5A6.5 6.5 0 0 1 8 14.5Z" fill="currentColor" />
              </svg>
              <span style={{ display: 'flex', flexDirection: 'column' }}>
                {inverted ? 'Light' : 'Invert'}
                <i className="underline"></i>
              </span>
            </button>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
