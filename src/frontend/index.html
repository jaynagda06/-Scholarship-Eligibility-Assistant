<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarship Eligibility Assistant - Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.5/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-card: #ffffff;
        --bg-card-elevated: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --border-subtle: #f1f5f9;
        --action-primary-bg: #0f172a;
        --action-primary-text: #ffffff;
        --action-secondary-bg: #f1f5f9;
        --action-secondary-text: #0f172a;
        --success: #16a34a;
        --warning: #d97706;
        --error: #dc2626;
        --info: #2563eb;
        --radius-card: 20px;
        --radius-control: 12px;
        --radius-pill: 9999px;
        --space-xs: 8px;
        --space-sm: 12px;
        --space-md: 16px;
        --space-lg: 20px;
        --space-xl: 24px;
        --space-2xl: 32px;
        --space-3xl: 40px;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        background: radial-gradient(1200px 600px at 80% -10%, #eef2ff 0%, transparent 50%), var(--bg-primary);
        min-height: 100vh;
        color: var(--text-primary);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      body.custom-cursor {
        cursor: none;
      }
      .cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.85);
        pointer-events: none;
        z-index: 10000;
        mix-blend-mode: difference;
        transform: translate(-50%, -50%);
        transition: width 0.18s ease, height 0.18s ease, background 0.18s ease, border 0.18s ease;
        will-change: transform;
      }
      .cursor.follower {
        width: 38px;
        height: 38px;
        background: transparent;
        border: 1px solid rgba(15, 23, 42, 0.25);
        mix-blend-mode: normal;
        transition: width 0.25s ease, height 0.25s ease, transform 0.1s ease, border 0.25s ease;
      }
      .cursor.hover {
        width: 24px;
        height: 24px;
        background: rgba(37, 99, 235, 0.9);
      }
      .cursor.follower.hover {
        width: 64px;
        height: 64px;
        border-color: rgba(37, 99, 235, 0.5);
      }
      @media (max-width: 768px), (pointer: coarse) {
        body.custom-cursor { cursor: auto; }
        .cursor, .cursor.follower { display: none; }
      }
      
      .app {
        min-height: 100vh;
        padding: var(--space-lg) var(--space-xl);
      }
      
      @media (max-width: 768px) {
        .app {
          padding: var(--space-md);
        }
      }
      
      .container {
        max-width: 1440px;
        margin: 0 auto;
      }
      
      .header {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-xl);
        margin-bottom: var(--space-2xl);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-lg);
        flex-wrap: wrap;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .header:hover {
        border-color: #33343A;
      }
      
      .header-left {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }
      
      .logo-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, var(--bg-card-elevated) 0%, var(--bg-card) 100%);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      
      .header-text h1 {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
        letter-spacing: -0.02em;
      }
      
      .header-text p {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 400;
      }
      
      .header-right {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }
      
      .status-indicator {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: var(--space-xs) var(--space-md);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 8px rgba(141, 216, 165, 0.6);
      }
      
      .btn-refresh {
        background: var(--action-secondary-bg);
        color: var(--action-secondary-text);
        border: 1px solid var(--border);
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-control);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: background 0.2s ease, border-color 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      
      .btn-refresh:hover {
        background: #323338;
        border-color: #33343A;
      }
      
      .btn-refresh:focus-visible {
        outline: 2px solid var(--info);
        outline-offset: 2px;
      }
      
      .overview {
        margin-bottom: var(--space-2xl);
      }
      
      .overview-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: var(--space-xl);
      }
      
      @media (max-width: 968px) {
        .overview-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .overview-main {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .overview-main:hover {
        border-color: #33343A;
      }
      
      .overview-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: var(--space-sm);
      }
      
      .overview-main h2 {
        font-size: 36px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-md);
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      
      @media (max-width: 768px) {
        .overview-main h2 {
          font-size: 28px;
        }
      }
      
      .overview-main p {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: var(--space-xl);
        max-width: 540px;
      }
      
      .overview-sidebar {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-md);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .overview-sidebar:hover {
        border-color: #33343A;
      }
      
      .overview-sidebar-label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }
      
      .overview-sidebar-value {
        font-size: 48px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      
      @media (max-width: 768px) {
        .overview-sidebar-value {
          font-size: 36px;
        }
      }
      
      .overview-sidebar-desc {
        font-size: 12px;
        color: var(--text-secondary);
      }
      
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      
      @media (max-width: 1024px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .stat-card:hover {
        border-color: #33343A;
      }
      
      .stat-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: var(--space-md);
      }
      
      .stat-value {
        font-size: 56px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-sm);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      
      @media (max-width: 768px) {
        .stat-value {
          font-size: 42px;
        }
      }
      
      .stat-desc {
        font-size: 12px;
        color: var(--text-secondary);
      }
      
      .forms-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      
      @media (max-width: 1024px) {
        .forms-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
        height: fit-content;
      }
      
      .card:hover {
        border-color: #33343A;
      }
      
      .card-header {
        margin-bottom: var(--space-xl);
      }
      
      .card-header h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-xs);
        letter-spacing: -0.01em;
      }
      
      .card-header p {
        font-size: 13px;
        color: var(--text-secondary);
      }
      
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
      }
      
      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }
      
      .form-group.full-width {
        grid-column: 1 / -1;
      }
      
      .form-group label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }
      
      .form-group input,
      .form-group select,
      .form-group textarea {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        width: 100%;
      }
      
      .form-group input:hover,
      .form-group select:hover,
      .form-group textarea:hover {
        border-color: #33343A;
      }
      
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--info);
        box-shadow: 0 0 0 3px rgba(169, 184, 255, 0.1);
      }
      
      .form-group textarea {
        resize: vertical;
        min-height: 80px;
        font-family: 'Inter', sans-serif;
      }
      
      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: var(--text-muted);
      }
      
      .btn-primary {
        background: var(--action-primary-bg);
        color: var(--action-primary-text);
        border: 1px solid var(--action-primary-bg);
        padding: 11px 20px;
        border-radius: var(--radius-control);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: opacity 0.2s ease, transform 0.2s ease;
        align-self: flex-start;
        margin-top: var(--space-md);
      }
      
      .btn-primary:hover:not(:disabled) {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      
      .btn-primary:active:not(:disabled) {
        transform: translateY(0);
      }
      
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      
      .btn-primary:focus-visible {
        outline: 2px solid var(--info);
        outline-offset: 2px;
      }
      
      .results-grid {
        display: grid;
        grid-template-columns: 4fr 8fr;
        gap: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      
      @media (max-width: 1024px) {
        .results-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .alert {
        padding: 12px 16px;
        border-radius: var(--radius-control);
        font-size: 13px;
        margin-bottom: var(--space-lg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-md);
        flex-wrap: wrap;
      }
      
      .alert-error {
        background: rgba(241, 138, 138, 0.1);
        color: var(--error);
        border-color: rgba(241, 138, 138, 0.3);
      }
      
      .alert-success {
        background: rgba(141, 216, 165, 0.1);
        color: var(--success);
        border-color: rgba(141, 216, 165, 0.3);
      }
      
      .scholarship-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        max-height: 500px;
        overflow-y: auto;
        padding-right: var(--space-xs);
      }
      
      .scholarship-list::-webkit-scrollbar {
        width: 8px;
      }
      
      .scholarship-list::-webkit-scrollbar-track {
        background: var(--bg-secondary);
        border-radius: var(--radius-control);
      }
      
      .scholarship-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: var(--radius-control);
      }
      
      .scholarship-item {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        padding: var(--space-lg);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .scholarship-item:hover {
        border-color: #33343A;
      }
      
      .scholarship-item h3 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-xs);
        letter-spacing: -0.01em;
      }
      
      .scholarship-org {
        font-size: 13px;
        color: var(--info);
        margin-bottom: var(--space-sm);
        font-weight: 500;
      }
      
      .scholarship-meta {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      
      .scholarship-meta:last-of-type {
        margin-bottom: var(--space-sm);
      }
      
      .scholarship-item a {
        color: var(--info);
        text-decoration: none;
        font-weight: 500;
      }
      
      .scholarship-item a:hover {
        text-decoration: underline;
      }
      
      .score-badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
      }
      
      .score-high {
        background: rgba(141, 216, 165, 0.1);
        color: var(--success);
        border-color: rgba(141, 216, 165, 0.3);
      }
      
      .score-medium {
        background: rgba(242, 200, 121, 0.1);
        color: var(--warning);
        border-color: rgba(242, 200, 121, 0.3);
      }
      
      .score-low {
        background: rgba(241, 138, 138, 0.1);
        color: var(--error);
        border-color: rgba(241, 138, 138, 0.3);
      }
      
      .empty-state {
        text-align: center;
        padding: var(--space-3xl);
        color: var(--text-muted);
        font-size: 13px;
      }
      .empty-state i {
        display: block;
        font-size: 28px;
        margin-bottom: var(--space-sm);
        color: var(--text-muted);
      }
      .empty-state p {
        margin-bottom: 4px;
      }
      
      .footer {
        margin-top: var(--space-3xl);
        padding-top: var(--space-xl);
        border-top: 1px solid var(--border-subtle);
        text-align: center;
      }
      
      .footer p {
        font-size: 11px;
        color: var(--text-muted);
      }
      
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="cursor"></div>
    <div class="cursor follower"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Same-origin API on Vercel (Services routing) and proxied by Vite locally.
      const API_BASE = '/api';

      function App() {
        const [students, setStudents] = useState([]);
        const [scholarships, setScholarships] = useState([]);
        const [recommendations, setRecommendations] = useState([]);
        const [selectedStudent, setSelectedStudent] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        
        const [newStudent, setNewStudent] = useState({
          phone: '',
          name: '',
          school: '',
          degree: '',
          year: 2024,
          annual_income: 0,
          category: 'GENERAL',
          disability_pct: 0
        });

        const [newScholarship, setNewScholarship] = useState({
          name: '',
          org: '',
          category: 'CENTRAL_GENERAL',
          eligibility_criteria: '',
          deadline: '',
          documents: '',
          url: ''
        });

        useEffect(() => {
          fetchData();
        }, []);

        // Custom cursor: a single delegated listener set, cleaned up on unmount.
        useEffect(() => {
          const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
          if (reduceMotion || coarsePointer) return;

          const cursor = document.querySelector('.cursor');
          const follower = document.querySelector('.cursor.follower');
          if (!cursor || !follower) return;

          document.body.classList.add('custom-cursor');

          const move = (e) => {
            cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
            follower.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
          };
          const isInteractive = (target) =>
            target instanceof Element &&
            target.closest('button, a, input, select, textarea, .card, .stat-card');
          const over = (e) => {
            if (isInteractive(e.target)) {
              cursor.classList.add('hover');
              follower.classList.add('hover');
            }
          };
          const out = (e) => {
            if (isInteractive(e.target)) {
              cursor.classList.remove('hover');
              follower.classList.remove('hover');
            }
          };

          window.addEventListener('mousemove', move, { passive: true });
          document.addEventListener('mouseover', over);
          document.addEventListener('mouseout', out);

          return () => {
            document.body.classList.remove('custom-cursor');
            window.removeEventListener('mousemove', move);
            document.removeEventListener('mouseover', over);
            document.removeEventListener('mouseout', out);
          };
        }, []);

        const fetchData = async () => {
          try {
            setError('');
            const [studentsRes, scholarshipsRes] = await Promise.all([
              fetch(`${API_BASE}/students`),
              fetch(`${API_BASE}/scholarships`)
            ]);

            if (!studentsRes.ok || !scholarshipsRes.ok) {
              throw new Error(
                `Server responded with ${studentsRes.status} / ${scholarshipsRes.status}`
              );
            }

            const [studentsData, scholarshipsData] = await Promise.all([
              studentsRes.json(),
              scholarshipsRes.json()
            ]);

            setStudents(Array.isArray(studentsData) ? studentsData : []);
            setScholarships(Array.isArray(scholarshipsData) ? scholarshipsData : []);
          } catch (err) {
            console.error('Dashboard data fetch failed:', err);
            setError('Check the server connection and try again.');
          }
        };

        const handleCreateStudent = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');
          
          try {
            const res = await fetch(`${API_BASE}/students`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(newStudent)
            });
            
            if (res.ok) {
              setSuccess('Student created successfully');
              setNewStudent({
                phone: '',
                name: '',
                school: '',
                degree: '',
                year: 2024,
                annual_income: 0,
                category: 'GENERAL',
                disability_pct: 0
              });
              fetchData();
            } else {
              setError('Failed to create student');
            }
          } catch (err) {
            setError('Error creating student');
          } finally {
            setLoading(false);
          }
        };

        const handleCreateScholarship = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');
          
          try {
            const res = await fetch(`${API_BASE}/scholarships`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(newScholarship)
            });
            
            if (res.ok) {
              setSuccess('Scholarship created successfully');
              setNewScholarship({
                name: '',
                org: '',
                category: 'CENTRAL_GENERAL',
                eligibility_criteria: '',
                deadline: '',
                documents: '',
                url: ''
              });
              fetchData();
            } else {
              setError('Failed to create scholarship');
            }
          } catch (err) {
            setError('Error creating scholarship');
          } finally {
            setLoading(false);
          }
        };

        const getRecommendations = async () => {
          if (!selectedStudent) {
            setError('Please select a student');
            return;
          }
          
          setLoading(true);
          setError('');
          setSuccess('');
          
          try {
            const res = await fetch(`${API_BASE}/students/${selectedStudent}/eligibility`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            });
            
            if (res.ok) {
              const data = await res.json();
              setRecommendations(data.matches || []);
              setSuccess('Recommendations generated');
            } else {
              setError('Failed to get recommendations');
            }
          } catch (err) {
            setError('Error getting recommendations');
          } finally {
            setLoading(false);
          }
        };

        const getScoreClass = (score) => {
          if (score >= 70) return 'score-high';
          if (score >= 40) return 'score-medium';
          return 'score-low';
        };

        const getScoreLabel = (score) => {
          if (score >= 70) return 'Good Match';
          if (score >= 40) return 'Partial Match';
          return 'Low Match';
        };

        return (
          <div className="app">
            <div className="container">
              <header className="header">
                <div className="header-left">
                  <div className="logo-icon" aria-hidden="true">
                    <i className="ph ph-graduation-cap"></i>
                  </div>
                  <div className="header-text">
                    <h1>Scholarship Eligibility Assistant</h1>
                    <p>Scholarship management workspace</p>
                  </div>
                </div>
                <div className="header-right">
                  <div className="status-indicator" role="status" aria-live="polite">
                    <span className="status-dot" aria-hidden="true"></span>
                    <span>{error ? 'Connection issue' : 'Live'}</span>
                  </div>
                  <button type="button" className="btn-refresh" onClick={fetchData} aria-label="Refresh dashboard data">
                    <i className="ph ph-arrow-clockwise" aria-hidden="true"></i>
                    <span>Refresh</span>
                  </button>
                </div>
              </header>

              <section className="overview" aria-labelledby="overview-title">
                <div className="overview-grid">
                  <div className="overview-main">
                    <div className="overview-eyebrow">Scholarship workspace</div>
                    <h2 id="overview-title">Find the right scholarship.</h2>
                    <p>Manage student profiles, explore available scholarships, and discover opportunities based on eligibility.</p>
                    <button
                      type="button"
                      className="btn-primary"
                      onClick={() => document.getElementById('student-form')?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
                    >
                      Register a student
                    </button>
                  </div>
                  <div className="overview-sidebar">
                    <div className="overview-sidebar-label">Available scholarships</div>
                    <div className="overview-sidebar-value">{scholarships.length}</div>
                    <div className="overview-sidebar-desc">Active scholarship records ready for matching</div>
                  </div>
                </div>
              </section>

              {error && (
                <div className="alert alert-error" role="alert">
                  <div>
                    <strong>Unable to load dashboard data.</strong>
                    <div>{error}</div>
                  </div>
                  <button type="button" className="btn-refresh" onClick={fetchData}>Try again</button>
                </div>
              )}
              {success && <div className="alert alert-success" role="status">{success}</div>}

              <section className="stats-grid" aria-label="Dashboard statistics">
                <div className="stat-card">
                  <div className="stat-label">Students registered</div>
                  <div className="stat-value">{students.length}</div>
                  <div className="stat-desc">Registered student profiles</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Scholarships available</div>
                  <div className="stat-value">{scholarships.length}</div>
                  <div className="stat-desc">Available scholarship records</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Recommendations</div>
                  <div className="stat-value">{recommendations.length}</div>
                  <div className="stat-desc">Generated eligibility recommendations</div>
                </div>
              </section>

              <section className="forms-grid" aria-label="Manage records">
                <div className="card" id="student-form">
                  <div className="card-header">
                    <h2>Register student</h2>
                    <p>Create a student profile for scholarship eligibility checks.</p>
                  </div>
                  <form onSubmit={handleCreateStudent}>
                    <div className="form-grid">
                      <div className="form-group">
                        <label htmlFor="student-phone">Phone number</label>
                        <input
                          id="student-phone"
                          type="tel"
                          value={newStudent.phone}
                          onChange={(e) => setNewStudent({...newStudent, phone: e.target.value})}
                          required
                          placeholder="e.g., 9876543210"
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="student-name">Full name</label>
                        <input
                          id="student-name"
                          type="text"
                          value={newStudent.name}
                          onChange={(e) => setNewStudent({...newStudent, name: e.target.value})}
                          required
                          placeholder="e.g., Ravi Kumar"
                        />
                      </div>
                      <div className="form-group full-width">
                        <label htmlFor="student-school">School / college</label>
                        <input
                          id="student-school"
                          type="text"
                          value={newStudent.school}
                          onChange={(e) => setNewStudent({...newStudent, school: e.target.value})}
                          placeholder="e.g., XYZ College"
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="student-degree">Degree / class</label>
                        <input
                          id="student-degree"
                          type="text"
                          value={newStudent.degree}
                          onChange={(e) => setNewStudent({...newStudent, degree: e.target.value})}
                          placeholder="e.g., B.Tech, 12th, 10th"
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="student-year">Year</label>
                        <input
                          id="student-year"
                          type="number"
                          value={newStudent.year}
                          onChange={(e) => setNewStudent({...newStudent, year: parseInt(e.target.value) || 0})}
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="student-income">Annual income (₹)</label>
                        <input
                          id="student-income"
                          type="number"
                          min="0"
                          value={newStudent.annual_income}
                          onChange={(e) => setNewStudent({...newStudent, annual_income: parseFloat(e.target.value) || 0})}
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="student-category">Category</label>
                        <select
                          id="student-category"
                          value={newStudent.category}
                          onChange={(e) => setNewStudent({...newStudent, category: e.target.value})}
                        >
                          <option value="GENERAL">General</option>
                          <option value="GENERAL_GIRLS">General Girls</option>
                          <option value="SC">SC</option>
                          <option value="ST">ST</option>
                          <option value="OBC">OBC</option>
                          <option value="SOCIAL_SC">Social SC</option>
                          <option value="SOCIAL_PWD">PWD</option>
                        </select>
                      </div>
                      <div className="form-group full-width">
                        <label htmlFor="student-disability">Disability percentage (%)</label>
                        <input
                          id="student-disability"
                          type="number"
                          min="0"
                          max="100"
                          value={newStudent.disability_pct}
                          onChange={(e) => setNewStudent({...newStudent, disability_pct: parseInt(e.target.value) || 0})}
                        />
                      </div>
                    </div>
                    <button type="submit" className="btn-primary" disabled={loading}>
                      {loading ? 'Registering…' : 'Register student'}
                    </button>
                  </form>
                </div>

                <div className="card">
                  <div className="card-header">
                    <h2>Add scholarship</h2>
                    <p>Add scholarship opportunities and their eligibility conditions.</p>
                  </div>
                  <form onSubmit={handleCreateScholarship}>
                    <div className="form-grid">
                      <div className="form-group full-width">
                        <label htmlFor="scholarship-name">Scholarship name</label>
                        <input
                          id="scholarship-name"
                          type="text"
                          value={newScholarship.name}
                          onChange={(e) => setNewScholarship({...newScholarship, name: e.target.value})}
                          required
                          placeholder="e.g., Central Sector Scheme"
                        />
                      </div>
                      <div className="form-group full-width">
                        <label htmlFor="scholarship-org">Organization</label>
                        <input
                          id="scholarship-org"
                          type="text"
                          value={newScholarship.org}
                          onChange={(e) => setNewScholarship({...newScholarship, org: e.target.value})}
                          required
                          placeholder="e.g., MHRD / AICTE"
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="scholarship-category">Category</label>
                        <select
                          id="scholarship-category"
                          value={newScholarship.category}
                          onChange={(e) => setNewScholarship({...newScholarship, category: e.target.value})}
                        >
                          <option value="CENTRAL_GENERAL">Central General</option>
                          <option value="STATE_GENERAL">State General</option>
                          <option value="GENERAL_GIRLS">General Girls</option>
                          <option value="SOCIAL_SC">Social SC</option>
                          <option value="SOCIAL_ST">Social ST</option>
                          <option value="SOCIAL_PWD">PWD</option>
                          <option value="SCIENCE_RESEARCH">Science Research</option>
                        </select>
                      </div>
                      <div className="form-group">
                        <label htmlFor="scholarship-deadline">Deadline</label>
                        <input
                          id="scholarship-deadline"
                          type="date"
                          value={newScholarship.deadline}
                          onChange={(e) => setNewScholarship({...newScholarship, deadline: e.target.value})}
                        />
                      </div>
                      <div className="form-group full-width">
                        <label htmlFor="scholarship-criteria">Eligibility criteria</label>
                        <textarea
                          id="scholarship-criteria"
                          value={newScholarship.eligibility_criteria}
                          onChange={(e) => setNewScholarship({...newScholarship, eligibility_criteria: e.target.value})}
                          rows="3"
                          placeholder="e.g., Class 12 pass. Min 80% aggregate. Family annual income < INR 4.5 lakh."
                        />
                      </div>
                      <div className="form-group full-width">
                        <label htmlFor="scholarship-documents">Documents required</label>
                        <input
                          id="scholarship-documents"
                          type="text"
                          value={newScholarship.documents}
                          onChange={(e) => setNewScholarship({...newScholarship, documents: e.target.value})}
                          placeholder="e.g., income_certificate, marksheets, etc."
                        />
                      </div>
                      <div className="form-group full-width">
                        <label htmlFor="scholarship-url">Website URL</label>
                        <input
                          id="scholarship-url"
                          type="url"
                          value={newScholarship.url}
                          onChange={(e) => setNewScholarship({...newScholarship, url: e.target.value})}
                          placeholder="e.g., https://scholarships.gov.in"
                        />
                      </div>
                    </div>
                    <button type="submit" className="btn-primary" disabled={loading}>
                      {loading ? 'Adding…' : 'Add scholarship'}
                    </button>
                  </form>
                </div>
              </section>

              <section className="results-grid" aria-label="Eligibility results">
                <div className="card">
                  <div className="card-header">
                    <h2>Check eligibility</h2>
                    <p>Find scholarship opportunities based on a student's profile.</p>
                  </div>
                  {students.length === 0 ? (
                    <div className="empty-state">
                      <i className="ph ph-user-plus" aria-hidden="true"></i>
                      <p>No student profiles yet.</p>
                      <p>Register a student to start checking eligibility.</p>
                    </div>
                  ) : (
                    <>
                      <div className="form-group">
                        <label htmlFor="student-select">Select student</label>
                        <select
                          id="student-select"
                          value={selectedStudent}
                          onChange={(e) => setSelectedStudent(e.target.value)}
                        >
                          <option value="">-- Select a student --</option>
                          {students.map((s) => (
                            <option key={s.id} value={s.id}>
                              {s.name} ({s.phone})
                            </option>
                          ))}
                        </select>
                      </div>
                      <button
                        type="button"
                        className="btn-primary"
                        onClick={getRecommendations}
                        disabled={loading || !selectedStudent}
                      >
                        {loading ? 'Checking…' : 'Get recommendations'}
                      </button>
                    </>
                  )}
                </div>

                <div className="card">
                  <div className="card-header">
                    <h2>Recommended scholarships</h2>
                    <p>Matches are ranked by eligibility score.</p>
                  </div>
                  {recommendations.length === 0 ? (
                    <div className="empty-state">
                      <i className="ph ph-magnifying-glass" aria-hidden="true"></i>
                      <p>No recommendations yet.</p>
                      <p>Select a student and click Get recommendations to find matching scholarships.</p>
                    </div>
                  ) : (
                    <div className="scholarship-list">
                      {recommendations.map((rec, idx) => {
                        const details = rec.details || {};
                        const score = rec.score || 0;
                        return (
                          <article key={idx} className="scholarship-item">
                            <h3>{details.name || 'Scholarship'}</h3>
                            {details.org && <div className="scholarship-org">{details.org}</div>}
                            {details.deadline && <div className="scholarship-meta">Deadline: {details.deadline}</div>}
                            {details.category && <div className="scholarship-meta">Category: {details.category}</div>}
                            {details.eligibility_criteria && (
                              <div className="scholarship-meta">{details.eligibility_criteria}</div>
                            )}
                            <div className="scholarship-meta">
                              <span className={`score-badge ${getScoreClass(score)}`}>
                                {score}% · {getScoreLabel(score)}
                              </span>
                            </div>
                            {details.url && (
                              <div className="scholarship-meta">
                                <a href={details.url} target="_blank" rel="noreferrer">Official website ↗</a>
                              </div>
                            )}
                          </article>
                        );
                      })}
                    </div>
                  )}
                </div>
              </section>

              <footer className="footer">
                <p>Scholarship Eligibility Assistant · Student and scholarship management workspace</p>
              </footer>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
