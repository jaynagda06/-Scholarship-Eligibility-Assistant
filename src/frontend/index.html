<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f0f0" />
    <title>Scholarship Eligibility Assistant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f0f0f0'/%3E%3Crect x='1.5' y='1.5' width='13' height='13' fill='none' stroke='%230f0f0f'/%3E%3Cpath d='M1.5 1.5L14.5 14.5' stroke='%230f0f0f'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.5/babel.min.js"></script>
    <style>
      /* ---------------------------------------------------------------
         Scholarship Eligibility Assistant — editorial interface
         Design language: hairline grid, monochrome palette, oversized
         type, difference-blended chrome, slow ease-out motion.
      ---------------------------------------------------------------- */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --paper: #f0f0f0;
        --ink: #0f0f0f;

        --bg: var(--paper);
        --fg: var(--ink);
        --line: rgba(15, 15, 15, 0.12);
        --line-strong: rgba(15, 15, 15, 0.26);
        --muted: rgba(15, 15, 15, 0.48);

        --ease: cubic-bezier(0.25, 1, 0.5, 1);
        --t: 0.5s var(--ease);
        --t-fast: 0.3s var(--ease);
        --t-slow: 0.8s var(--ease);

        --pad: clamp(1rem, 2.4vw, 2.25rem);
        --gap: clamp(0.75rem, 1.4vw, 1.25rem);

        color-scheme: light;
      }

      :root[data-invert="true"] {
        --bg: var(--ink);
        --fg: var(--paper);
        --line: rgba(242, 240, 240, 0.14);
        --line-strong: rgba(242, 240, 240, 0.3);
        --muted: rgba(242, 240, 240, 0.5);
        color-scheme: dark;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
        background: var(--bg);
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: -0.01em;
        overflow-x: hidden;
        transition: background-color 0.6s var(--ease), color 0.6s var(--ease);
      }

      body:not(.is-loaded) {
        overflow: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }

      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      img,
      svg {
        display: block;
      }

      ::selection {
        background: var(--fg);
        color: var(--bg);
      }

      /* ---------------------------------------------------------------
         Typography
      ---------------------------------------------------------------- */

      .display {
        font-size: clamp(2.75rem, 8.6vw, 8.75rem);
        font-weight: 400;
        line-height: 0.86;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }

      .h2 {
        font-size: clamp(2rem, 5.4vw, 4.75rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.045em;
      }

      .h3 {
        font-size: clamp(1.375rem, 2.5vw, 2.125rem);
        font-weight: 400;
        line-height: 1.04;
        letter-spacing: -0.03em;
      }

      .cap {
        display: inline-block;
        font-size: 0.6875rem;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .body-sm {
        font-size: 0.9375rem;
        line-height: 1.5;
        letter-spacing: -0.005em;
        color: var(--muted);
      }

      /* ---------------------------------------------------------------
         Preloader
      ---------------------------------------------------------------- */

      .preloader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: var(--pad);
        background: var(--paper);
        color: var(--ink);
        transition: transform 0.9s var(--ease);
        will-change: transform;
      }

      .preloader.is-done {
        transform: translateY(-101%);
      }

      .preloader-inner {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        flex: 1;
        padding-bottom: 1rem;
      }

      .preloader-label {
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        max-width: 12rem;
        line-height: 1.2;
      }

      .preloader-count {
        display: flex;
        align-items: flex-start;
        font-size: clamp(4rem, 13vw, 11rem);
        line-height: 0.8;
        letter-spacing: -0.06em;
      }

      .preloader-pct {
        font-size: 0.28em;
        line-height: 1;
        margin-top: 0.25em;
        margin-left: 0.1em;
        letter-spacing: 0;
      }

      .preloader-track {
        height: 1px;
        width: 100%;
        background: rgba(15, 15, 15, 0.14);
        overflow: hidden;
      }

      .preloader-track span {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left;
      }

      /* ---------------------------------------------------------------
         Custom cursor
      ---------------------------------------------------------------- */

      .cursor,
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 300;
        pointer-events: none;
        border-radius: 50%;
        will-change: transform;
      }

      /* The cursor carries the surface it is over so it stays visible on both
         the light page and the dark index band. */
      .cursor[data-surface="light"],
      .cursor-ring[data-surface="light"] {
        --fg: var(--ink);
      }

      .cursor[data-surface="dark"],
      .cursor-ring[data-surface="dark"] {
        --fg: var(--paper);
      }

      .cursor {
        width: 7px;
        height: 7px;
        margin: -3.5px 0 0 -3.5px;
        background: var(--fg);
        transition: width 0.25s var(--ease), height 0.25s var(--ease), margin 0.25s var(--ease),
          opacity 0.3s var(--ease);
      }

      .cursor-ring {
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border: 1px solid color-mix(in srgb, var(--fg) 65%, transparent);
        transition: width 0.4s var(--ease), height 0.4s var(--ease), margin 0.4s var(--ease),
          opacity 0.3s var(--ease), border-color 0.4s var(--ease);
      }

      .cursor.is-hover {
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
      }

      .cursor-ring.is-hover {
        width: 62px;
        height: 62px;
        margin: -31px 0 0 -31px;
        border-color: color-mix(in srgb, var(--fg) 35%, transparent);
      }

      body.has-cursor,
      body.has-cursor * {
        cursor: none !important;
      }

      /* Keep the native caret/resize affordances on form fields. */
      body.has-cursor input,
      body.has-cursor textarea,
      body.has-cursor select {
        cursor: auto !important;
      }

      body.has-cursor textarea {
        cursor: text !important;
      }

      @media (pointer: coarse), (max-width: 1023px) {
        .cursor,
        .cursor-ring {
          display: none;
        }
      }

      /* ---------------------------------------------------------------
         Fixed hairline grid
      ---------------------------------------------------------------- */

      .grid-lines {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .grid-lines span {
        position: absolute;
        top: 0;
        height: 100%;
        width: 1px;
        /* A blending overlay, not a normal hairline: it must stay visible over
           both the light page and the dark index band. */
        background: var(--paper);
        opacity: 0.07;
        mix-blend-mode: difference;
      }

      .grid-lines span:nth-child(1) {
        left: 12.5%;
      }

      .grid-lines span:nth-child(2) {
        left: 62.5%;
      }

      @media (max-width: 1023px) {
        .grid-lines span:nth-child(1) {
          left: 0;
        }
        .grid-lines span:nth-child(2) {
          left: 50%;
        }
      }

      /* ---------------------------------------------------------------
         Header
      ---------------------------------------------------------------- */

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        color: var(--fg);
        pointer-events: none;
      }

      .header-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem var(--pad);
        border-bottom: 1px solid var(--line);
        pointer-events: auto;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-shrink: 0;
      }

      .logo svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      .logo-text {
        font-size: 0.625rem;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .header-nav {
        display: flex;
        align-items: center;
        gap: clamp(1rem, 2.4vw, 2.5rem);
      }

      .header-nav a {
        position: relative;
        padding-bottom: 0.15rem;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .header-nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.55s var(--ease);
      }

      .header-nav a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: clamp(0.75rem, 1.6vw, 1.5rem);
        flex-shrink: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2.4s var(--ease) infinite;
      }

      .status-dot.is-error {
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      .header-action {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding-bottom: 0.15rem;
        position: relative;
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .header-action::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform-origin: right;
        transition: transform 0.55s var(--ease);
      }

      .header-action:hover::after {
        transform: scaleX(0);
      }

      .scroll-progress {
        position: absolute;
        left: 0;
        bottom: -1px;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left;
      }

      @media (max-width: 900px) {
        .header-nav {
          display: none;
        }
      }

      @media (max-width: 560px) {
        .logo-text span {
          display: none;
        }
      }
      /* ---------------------------------------------------------------
         Section shell
      ---------------------------------------------------------------- */

      .app {
        position: relative;
        z-index: 1;
      }

      .section {
        position: relative;
        border-top: 1px solid var(--line);
        scroll-margin-top: 3.5rem;
      }

      .section--dark {
        --bg: var(--ink);
        --fg: var(--paper);
        --line: rgba(242, 240, 240, 0.14);
        --line-strong: rgba(242, 240, 240, 0.3);
        --muted: rgba(242, 240, 240, 0.52);
        background: var(--bg);
        color: var(--fg);
      }

      :root[data-invert="true"] .section--dark {
        --bg: var(--paper);
        --fg: var(--ink);
        --line: rgba(15, 15, 15, 0.12);
        --line-strong: rgba(15, 15, 15, 0.26);
        --muted: rgba(15, 15, 15, 0.48);
      }

      .section-head {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        column-gap: var(--gap);
        row-gap: 1.5rem;
        padding: clamp(3.5rem, 8vw, 7rem) var(--pad) clamp(2rem, 4vw, 3.5rem);
      }

      .section-caption {
        grid-column: 1 / 4;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--muted);
      }

      .section-caption b {
        font-weight: 500;
        color: var(--fg);
      }

      .section-head .h2 {
        grid-column: 1 / 7;
      }

      .section-head .section-note {
        grid-column: 7 / 9;
        align-self: end;
        max-width: 22rem;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      @media (max-width: 1023px) {
        .section-head {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .section-caption {
          grid-column: 1 / -1;
        }
        .section-head .h2 {
          grid-column: 1 / -1;
        }
        .section-head .section-note {
          grid-column: 1 / -1;
          max-width: none;
        }
      }

      /* ---------------------------------------------------------------
         Reveal
      ---------------------------------------------------------------- */

      [data-reveal] {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
        transition-delay: calc(var(--i, 0) * 70ms);
      }

      [data-reveal].in {
        opacity: 1;
        transform: none;
      }

      .line-mask {
        display: block;
        overflow: hidden;
        padding-bottom: 0.04em;
      }

      .line-mask > span {
        display: block;
        transform: translateY(115%);
        transition: transform 1.15s var(--ease);
        transition-delay: calc(var(--d, 0) * 110ms);
      }

      .app.is-loaded .line-mask > span {
        transform: translateY(0);
      }

      .hero-fade {
        opacity: 0;
        transition: opacity 1.1s var(--ease) 0.7s;
      }

      .app.is-loaded .hero-fade {
        opacity: 1;
      }

      /* ---------------------------------------------------------------
         Masked word rise — display headings only
      ---------------------------------------------------------------- */

      /* Each word gets its own clipping box. The padding is clip room for
         descenders, punctuation and the tight negative tracking's glyph
         overhang; the matching negative margin cancels it again, so the line
         box, the settled baseline and the line breaks never move. */
      .word-mask {
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        padding: 0 var(--mask-x) var(--mask-pad);
        margin: 0 calc(var(--mask-x) * -1) calc(var(--mask-pad) * -1);
      }

      .word-mask > span {
        display: inline-block;
        transform: translateY(calc(100% + var(--mask-pad)));
        opacity: 0;
      }

      .split-head {
        --mask-pad: 0.24em;
        --mask-x: 0.1em;
        --word-step: 50ms;
      }

      .split-head.is-in .word-mask > span {
        animation-name: word-rise;
        animation-duration: 0.9s;
        animation-timing-function: var(--ease);
        animation-delay: calc(var(--i, 0) * var(--word-step));
        animation-fill-mode: both;
      }

      @keyframes word-rise {
        from {
          transform: translateY(calc(100% + var(--mask-pad)));
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .word-mask {
          display: inline;
          overflow: visible;
          padding: 0;
          margin: 0;
          vertical-align: baseline;
        }
        .word-mask > span,
        .split-head.is-in .word-mask > span {
          display: inline;
          transform: none;
          opacity: 1;
          animation: none;
        }
      }

      /* ---------------------------------------------------------------
         Hero
      ---------------------------------------------------------------- */

      .hero {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(5rem, 12vh, 8rem) var(--pad) 1.25rem;
        border-top: 0;
      }

      .hero-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .hero-top .cap {
        color: var(--muted);
        max-width: 16rem;
      }

      .hero-top-right {
        text-align: right;
      }

      .hero-mid {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: clamp(2rem, 8vh, 6rem) 0;
      }

      .hero-tagline {
        text-align: right;
      }

      .hero-bottom {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        column-gap: var(--gap);
        row-gap: 2rem;
        align-items: end;
        padding-top: 1rem;
      }

      .hero-desc {
        grid-column: 1 / 4;
        max-width: 22rem;
      }

      .hero-actions {
        grid-column: 4 / 7;
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: center;
      }

      .scroll-cue {
        grid-column: 8 / 9;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--muted);
      }

      .scroll-cue i {
        display: block;
        width: 1px;
        height: 46px;
        background: linear-gradient(180deg, var(--line-strong), transparent);
        position: relative;
        overflow: hidden;
      }

      .scroll-cue i::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 40%;
        background: var(--fg);
        animation: scroll-line 2.4s var(--ease) infinite;
      }

      @keyframes scroll-line {
        0% {
          transform: translateY(-100%);
        }
        60%,
        100% {
          transform: translateY(250%);
        }
      }

      @media (max-width: 1023px) {
        .hero-bottom {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .hero-desc {
          grid-column: 1 / -1;
        }
        .hero-actions {
          grid-column: 1 / -1;
        }
        .scroll-cue {
          display: none;
        }
        .hero-top-right {
          display: none;
        }
      }

      /* ---------------------------------------------------------------
         Marquee
      ---------------------------------------------------------------- */

      .marquee {
        position: relative;
        overflow: hidden;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 0.85rem 0;
      }

      .marquee-track {
        display: flex;
        width: max-content;
        animation: marquee 34s linear infinite;
      }

      .marquee:hover .marquee-track {
        animation-play-state: paused;
      }

      .marquee-group {
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .marquee-group span {
        display: inline-flex;
        align-items: center;
        gap: 1.5rem;
        padding-right: 1.5rem;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .marquee-group span::after {
        content: "";
        width: 5px;
        height: 5px;
        background: currentColor;
        opacity: 0.4;
        transform: rotate(45deg);
      }

      @keyframes marquee {
        to {
          transform: translateX(-50%);
        }
      }

      /* ---------------------------------------------------------------
         Numbers
      ---------------------------------------------------------------- */

      .numbers {
        border-top: 1px solid var(--line);
      }

      .numbers-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: clamp(3rem, 6vw, 5rem) 0;
      }

      .number-cell {
        padding: 0 var(--pad);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .number-cell + .number-cell {
        border-left: 1px solid var(--line);
      }

      .number-cell .cap {
        color: var(--muted);
      }

      .number-value {
        font-size: clamp(3.25rem, 8vw, 7rem);
        line-height: 0.85;
        letter-spacing: -0.06em;
        font-variant-numeric: tabular-nums;
      }

      .number-desc {
        font-size: 0.8125rem;
        line-height: 1.4;
        color: var(--muted);
        max-width: 15rem;
      }

      @media (max-width: 1023px) {
        .numbers-grid {
          grid-template-columns: 1fr;
        }
        .number-cell {
          padding: 1.75rem var(--pad);
        }
        .number-cell + .number-cell {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }

      /* ---------------------------------------------------------------
         Method band
      ---------------------------------------------------------------- */

      .method {
        border-top: 1px solid var(--line);
        padding-bottom: clamp(2rem, 5vw, 4rem);
      }

      .method-row {
        display: grid;
        grid-template-columns: 3.5rem 1fr 24rem;
        align-items: baseline;
        column-gap: var(--gap);
        padding: clamp(1.25rem, 2.5vw, 2rem) var(--pad);
        border-top: 1px solid var(--line);
        transition: background-color 0.5s var(--ease), color 0.5s var(--ease);
      }

      .method-row:hover {
        background: var(--fg);
        color: var(--bg);
      }

      .method-row:hover .method-index,
      .method-row:hover .method-text {
        color: inherit;
      }

      .method-index {
        color: var(--muted);
        transition: color 0.5s var(--ease);
      }

      .method-word {
        font-size: clamp(2rem, 5.2vw, 4.5rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.045em;
        text-transform: uppercase;
        transition: transform 0.7s var(--ease);
      }

      .method-row:hover .method-word {
        transform: translateX(0.75rem);
      }

      .method-text {
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
        transition: color 0.5s var(--ease);
      }

      @media (max-width: 1023px) {
        .method-row {
          grid-template-columns: 2.5rem 1fr;
          row-gap: 0.75rem;
        }
        .method-text {
          grid-column: 2 / -1;
        }
      }
      /* ---------------------------------------------------------------
         Scholarship index (dark)
      ---------------------------------------------------------------- */

      .index-list {
        border-top: 1px solid var(--line);
      }

      .index-row {
        position: relative;
        display: grid;
        grid-template-columns: 3.5rem minmax(0, 1fr) 12rem 9rem 8rem 2rem;
        align-items: baseline;
        column-gap: var(--gap);
        padding: clamp(1.1rem, 2vw, 1.6rem) var(--pad);
        border-bottom: 1px solid var(--line);
        overflow: hidden;
        transition: color 0.5s var(--ease);
      }

      .index-row::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--fg);
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.65s var(--ease);
        z-index: 0;
      }

      .index-row:hover::before {
        transform: scaleY(1);
      }

      .index-row > * {
        position: relative;
        z-index: 1;
        transition: color 0.5s var(--ease), transform 0.65s var(--ease);
      }

      .index-row:hover > * {
        color: var(--bg);
      }

      .index-num {
        color: var(--muted);
      }

      .index-row:hover .index-num {
        color: inherit;
      }

      .index-name {
        font-size: clamp(1.25rem, 2.2vw, 1.875rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.03em;
        max-width: 30ch;
      }

      .index-row:hover .index-name {
        transform: translateX(0.5rem);
      }

      .index-org,
      .index-cat,
      .index-deadline {
        font-size: 0.75rem;
        line-height: 1.35;
        color: var(--muted);
        letter-spacing: 0.01em;
      }

      .index-row:hover .index-org,
      .index-row:hover .index-cat,
      .index-row:hover .index-deadline {
        color: inherit;
        opacity: 0.72;
      }

      .index-arrow {
        justify-self: end;
        font-size: 0.875rem;
        opacity: 0;
        transform: translate(-6px, 6px);
        transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
      }

      .index-row:hover .index-arrow {
        opacity: 1;
        transform: none;
      }

      .index-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem var(--pad);
        color: var(--muted);
      }

      @media (max-width: 1100px) {
        .index-row {
          grid-template-columns: 2.5rem minmax(0, 1fr) 2rem;
          row-gap: 0.5rem;
        }
        .index-org,
        .index-cat,
        .index-deadline {
          grid-column: 2 / 3;
        }
        .index-cat,
        .index-deadline {
          display: inline;
        }
        .index-org {
          margin-top: 0.25rem;
        }
        .index-arrow {
          grid-column: 3 / 4;
          grid-row: 1;
        }
      }

      /* ---------------------------------------------------------------
         Accordion
      ---------------------------------------------------------------- */

      .accordion {
        border-top: 1px solid var(--line);
      }

      .acc-item {
        border-bottom: 1px solid var(--line);
      }

      .acc-head {
        display: grid;
        grid-template-columns: 3.5rem minmax(0, 1fr) 14rem 1.5rem;
        align-items: center;
        column-gap: var(--gap);
        width: 100%;
        text-align: left;
        padding: clamp(1.25rem, 2.4vw, 1.9rem) var(--pad);
        transition: background-color 0.5s var(--ease);
      }

      .acc-head:hover {
        background: color-mix(in srgb, var(--fg) 4%, transparent);
      }

      .acc-index {
        color: var(--muted);
      }

      .acc-title {
        font-size: clamp(1.25rem, 2.6vw, 2rem);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.05;
        transition: transform 0.65s var(--ease);
      }

      .acc-head:hover .acc-title {
        transform: translateX(0.5rem);
      }

      .acc-meta {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
        text-align: right;
      }

      .acc-plus {
        position: relative;
        width: 16px;
        height: 16px;
        justify-self: end;
      }

      .acc-plus i {
        position: absolute;
        background: currentColor;
        transition: transform 0.65s var(--ease);
      }

      .acc-plus i:first-child {
        left: 0;
        top: 7.5px;
        width: 16px;
        height: 1px;
      }

      .acc-plus i:last-child {
        left: 7.5px;
        top: 0;
        width: 1px;
        height: 16px;
      }

      .acc-item.is-open .acc-plus i:last-child {
        transform: rotate(90deg);
      }

      .acc-body {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.75s var(--ease);
      }

      .acc-item.is-open .acc-body {
        grid-template-rows: 1fr;
      }

      .acc-body-inner {
        overflow: hidden;
        min-height: 0;
      }

      .acc-content {
        padding: 0 var(--pad) clamp(2rem, 4vw, 3.5rem);
      }

      @media (max-width: 1023px) {
        .acc-head {
          grid-template-columns: 2.5rem minmax(0, 1fr) 1.5rem;
        }
        .acc-meta {
          display: none;
        }
      }

      /* ---------------------------------------------------------------
         Forms
      ---------------------------------------------------------------- */

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: clamp(1.5rem, 4vw, 4rem);
        row-gap: clamp(1.5rem, 2.6vw, 2.25rem);
        padding-top: clamp(1rem, 2vw, 1.5rem);
        margin-bottom: clamp(1.75rem, 3vw, 2.5rem);
        max-width: 62rem;
      }

      .field {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .field--full {
        grid-column: 1 / -1;
      }

      .field label {
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line-strong);
        border-radius: 0;
        outline: none;
        padding: 0.45rem 0;
        font-size: 0.9375rem;
        letter-spacing: -0.005em;
        transition: border-color 0.4s var(--ease);
      }

      .field textarea {
        resize: vertical;
        min-height: 4.5rem;
        line-height: 1.45;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--fg);
      }

      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }

      .field select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 1.5rem;
      }

      .field select option {
        background: var(--paper);
        color: var(--ink);
      }

      .field--select::after {
        content: "";
        position: absolute;
        right: 0.15rem;
        bottom: 0.95rem;
        width: 6px;
        height: 6px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: rotate(45deg);
        opacity: 0.6;
        pointer-events: none;
      }

      @media (max-width: 720px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------------------------------------------------------------
         Buttons
      ---------------------------------------------------------------- */

      .btn-line {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding-bottom: 0.2rem;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .btn-line::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform-origin: right;
        transition: transform 0.6s var(--ease);
      }

      .btn-line:hover::after {
        transform: scaleX(0);
      }

      .btn-solid {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: clamp(2rem, 5vw, 4rem);
        padding: 0.9rem 1.1rem;
        background: var(--fg);
        color: var(--bg);
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        box-shadow: inset 0 0 0 1px var(--fg);
        transition: background-color 0.45s var(--ease), color 0.45s var(--ease);
      }

      .btn-solid:hover:not(:disabled) {
        background: transparent;
        color: var(--fg);
      }

      .btn-solid:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-solid i {
        display: block;
        font-style: normal;
        transition: transform 0.5s var(--ease);
      }

      .btn-solid:hover:not(:disabled) i {
        transform: translateX(0.35rem);
      }
      /* ---------------------------------------------------------------
         Match / recommendations
      ---------------------------------------------------------------- */

      .match-controls {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: clamp(1.25rem, 3vw, 2.5rem);
        padding: 0 var(--pad) clamp(2rem, 4vw, 3rem);
      }

      .match-controls .field {
        flex: 1 1 20rem;
        max-width: 34rem;
      }

      .rank-list {
        border-top: 1px solid var(--line);
      }

      .rank-row {
        display: grid;
        grid-template-columns: 3.5rem minmax(0, 1fr) 6.5rem 2rem;
        align-items: center;
        column-gap: var(--gap);
        padding: clamp(1.1rem, 2vw, 1.6rem) var(--pad);
        border-bottom: 1px solid var(--line);
      }

      .rank-num {
        color: var(--muted);
        align-self: start;
        padding-top: 0.35rem;
      }

      .rank-main {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
      }

      .rank-name {
        font-size: clamp(1.1rem, 1.9vw, 1.6rem);
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .rank-meta {
        font-size: 0.75rem;
        line-height: 1.4;
        color: var(--muted);
        letter-spacing: 0.01em;
      }

      .rank-criteria {
        font-size: 0.8125rem;
        line-height: 1.45;
        color: var(--muted);
        max-width: 62ch;
      }

      .score-bar {
        position: relative;
        height: 1px;
        width: 100%;
        max-width: 46rem;
        background: var(--line);
        margin-top: 0.5rem;
      }

      .score-bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--w, 0%);
        height: 1px;
        background: var(--fg);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1.3s var(--ease) 0.15s;
      }

      .rank-row.in .score-bar span {
        transform: scaleX(1);
      }

      .rank-score {
        justify-self: end;
        display: flex;
        align-items: flex-start;
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        line-height: 0.9;
        letter-spacing: -0.05em;
        font-variant-numeric: tabular-nums;
      }

      .rank-score em {
        font-style: normal;
        font-size: 0.36em;
        line-height: 1;
        margin-top: 0.25em;
        margin-left: 0.1em;
        letter-spacing: 0;
        color: var(--muted);
      }

      .rank-link {
        justify-self: end;
        font-size: 0.875rem;
        opacity: 0.45;
        transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
      }

      .rank-link:hover {
        opacity: 1;
        transform: translate(2px, -2px);
      }

      @media (max-width: 900px) {
        .rank-row {
          grid-template-columns: 2.5rem minmax(0, 1fr) 4.5rem;
        }
        .rank-link {
          display: none;
        }
      }

      /* ---------------------------------------------------------------
         Alerts + empty states
      ---------------------------------------------------------------- */

      .alert {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem var(--pad);
        background: var(--fg);
        color: var(--bg);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 0.8125rem;
        line-height: 1.4;
      }

      .alert strong {
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.625rem;
        display: block;
        margin-bottom: 0.15rem;
        opacity: 0.6;
      }

      .alert-close {
        flex-shrink: 0;
        font-size: 0.625rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding-bottom: 0.15rem;
        border-bottom: 1px solid currentColor;
        opacity: 0.7;
        transition: opacity 0.3s var(--ease);
      }

      .alert-close:hover {
        opacity: 1;
      }

      .empty {
        display: grid;
        gap: 0.6rem;
        padding: clamp(2.5rem, 6vw, 5rem) var(--pad);
        border-top: 1px solid var(--line);
      }

      .empty-index {
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        color: var(--line-strong);
      }

      .empty p {
        font-size: 0.9375rem;
        color: var(--muted);
        max-width: 34rem;
        line-height: 1.5;
      }

      /* ---------------------------------------------------------------
         Footer
      ---------------------------------------------------------------- */

      .site-footer {
        position: relative;
        border-top: 1px solid var(--line);
        padding: clamp(3rem, 7vw, 6rem) var(--pad) 1.5rem;
      }

      .footer-big {
        font-size: clamp(2.5rem, 8.6vw, 8.5rem);
        font-weight: 400;
        line-height: 0.86;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }

      .footer-big .line-mask > span {
        transition-delay: calc(var(--d, 0) * 90ms);
      }

      .footer-meta {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        column-gap: var(--gap);
        row-gap: 1.5rem;
        margin-top: clamp(3rem, 6vw, 5rem);
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
      }

      .footer-meta div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .footer-meta .cap {
        color: var(--muted);
      }

      .footer-meta p,
      .footer-meta a {
        font-size: 0.8125rem;
        line-height: 1.4;
      }

      .footer-legal {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: clamp(2rem, 4vw, 3rem);
        font-size: 0.6875rem;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .footer-meta {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .footer-legal {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.5rem;
        }
      }

      /* ---------------------------------------------------------------
         Fixed chrome: section nav + invert
      ---------------------------------------------------------------- */

      /* The header, section nav and invert button float above sections that
         alternate light and dark, so each carries the surface it overlaps and
         flips its own tokens to match. */
      .site-header[data-surface="light"],
      .section-nav[data-surface="light"],
      .invert-btn[data-surface="light"] {
        --fg: var(--ink);
        --line: rgba(15, 15, 15, 0.18);
      }

      .site-header[data-surface="dark"],
      .section-nav[data-surface="dark"],
      .invert-btn[data-surface="dark"] {
        --fg: var(--paper);
        --line: rgba(242, 240, 240, 0.18);
      }

      .section-nav {
        position: fixed;
        right: var(--pad);
        bottom: 1.1rem;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.4rem;
        color: var(--fg);
      }

      .section-nav a {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.4;
        transition: opacity 0.45s var(--ease);
      }

      .section-nav a:hover,
      .section-nav a.is-active {
        opacity: 1;
      }

      .section-nav a i {
        display: block;
        width: 18px;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.5s var(--ease);
      }

      .section-nav a.is-active i {
        transform: scaleX(1);
      }

      .invert-btn {
        position: fixed;
        left: var(--pad);
        bottom: 1.1rem;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--fg);
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .invert-btn svg {
        width: 15px;
        height: 15px;
      }

      .invert-btn .underline {
        display: block;
        height: 1px;
        width: 100%;
        background: currentColor;
        margin-top: 0.2rem;
        transform-origin: right;
        transition: transform 0.5s var(--ease);
      }

      .invert-btn:hover .underline {
        transform: scaleX(0);
      }

      @media (max-width: 720px) {
        .section-nav {
          display: none;
        }
        .invert-btn span {
          display: none;
        }
      }

      /* ---------------------------------------------------------------
         Reduced motion
      ---------------------------------------------------------------- */

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        [data-reveal] {
          opacity: 1;
          transform: none;
        }
        .line-mask > span {
          transform: none;
        }
        .hero-fade {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="cursor" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <div class="grid-lines" aria-hidden="true">
      <span></span>
      <span></span>
    </div>

    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="preloader-inner">
        <div class="preloader-label">Scholarship<br />Eligibility Assistant</div>
        <div class="preloader-count">
          <span id="pl-count">0</span><span class="preloader-pct">%</span>
        </div>
      </div>
      <div class="preloader-track"><span id="pl-bar"></span></div>
    </div>

    <div id="root"></div>
    <script>
      // Preloader runs before React so the page is never blank while the
      // CDN bundles download and Babel compiles the JSX.
      (function () {
        var preloader = document.getElementById("preloader");
        var count = document.getElementById("pl-count");
        var bar = document.getElementById("pl-bar");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var duration = reduce ? 200 : 1500;
        var start = performance.now();

        function finish() {
          preloader.classList.add("is-done");
          document.body.classList.add("is-loaded");
          window.__preloaderDone = true;
          window.dispatchEvent(new Event("preloader:done"));
          window.setTimeout(function () {
            preloader.style.display = "none";
          }, 1100);
        }

        function tick(now) {
          var p = Math.min((now - start) / duration, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          count.textContent = Math.round(eased * 100);
          bar.style.transform = "scaleX(" + eased + ")";
          if (p < 1) {
            requestAnimationFrame(tick);
          } else {
            finish();
          }
        }

        requestAnimationFrame(tick);
      })();
    </script>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      // Same-origin API on Vercel (Services routing) and proxied by Vite locally.
      const API_BASE = '/api';

      const SECTIONS = [
        { id: 'overview', label: 'Overview' },
        { id: 'index', label: 'Index' },
        { id: 'register', label: 'Register' },
        { id: 'match', label: 'Match' }
      ];

      const METHOD = [
        {
          word: 'Collect',
          text: 'A student profile captures income, category, degree and disability — the signals every scheme is scored against.'
        },
        {
          word: 'Score',
          text: 'Each scholarship is parsed into rules, then measured against the profile to produce a single eligibility figure.'
        },
        {
          word: 'Rank',
          text: 'Matches return ordered by fit, so the strongest opportunities surface first with the reasoning attached.'
        }
      ];

      const pad2 = (n) => String(n).padStart(2, '0');

      // Resolve the real surface behind a viewport row. A .section--dark band is
      // dark in the light theme but light in the inverted theme, so its class
      // alone is not enough. The invert attribute is the single source of truth.
      const surfaceAtY = (y) => {
        const inverted = document.documentElement.dataset.invert === 'true';
        const hosts = document.querySelectorAll('.section, .method');
        for (let i = 0; i < hosts.length; i++) {
          const rect = hosts[i].getBoundingClientRect();
          if (y >= rect.top && y < rect.bottom) {
            return hosts[i].classList.contains('section--dark') !== inverted
              ? 'dark'
              : 'light';
          }
        }
        return inverted ? 'dark' : 'light';
      };

      function useInView(threshold) {
        const ref = useRef(null);
        const [inView, setInView] = useState(false);

        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          if (!('IntersectionObserver' in window)) {
            setInView(true);
            return;
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setInView(true);
                  io.disconnect();
                }
              });
            },
            { threshold: threshold || 0.4 }
          );
          io.observe(el);
          return () => io.disconnect();
        }, []);

        return [ref, inView];
      }

      function Counter({ value }) {
        const [ref, inView] = useInView(0.5);
        const [display, setDisplay] = useState(0);

        useEffect(() => {
          if (!inView) return;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce) {
            setDisplay(value);
            return;
          }
          let frame;
          let start;
          const step = (now) => {
            if (!start) start = now;
            const p = Math.min((now - start) / 1400, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            setDisplay(Math.round(eased * value));
            if (p < 1) frame = requestAnimationFrame(step);
          };
          frame = requestAnimationFrame(step);
          return () => cancelAnimationFrame(frame);
        }, [inView, value]);

        return (
          <span ref={ref} className="number-value">
            {pad2(display)}
          </span>
        );
      }

      function App() {
        const [students, setStudents] = useState([]);
        const [scholarships, setScholarships] = useState([]);
        const [recommendations, setRecommendations] = useState([]);
        const [selectedStudent, setSelectedStudent] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        const [loaded, setLoaded] = useState(false);
        const [activeSection, setActiveSection] = useState('overview');
        const [inverted, setInverted] = useState(false);
        const [surface, setSurface] = useState({ top: 'light', bottom: 'light' });
        const [openPanel, setOpenPanel] = useState('student');

        const [newStudent, setNewStudent] = useState({
          phone: '',
          name: '',
          school: '',
          degree: '',
          year: 2024,
          annual_income: 0,
          category: 'GENERAL',
          disability_pct: 0

        const [newScholarship, setNewScholarship] = useState({
          name: '',
          org: '',
          category: 'CENTRAL_GENERAL',
          eligibility_criteria: '',
          deadline: '',
          documents: '',
          url: ''
        });

        const progressRef = useRef(null);

        useEffect(() => {
          fetchData();
        }, []);

        // Reveal the hero once the preloader curtain has lifted.
        useEffect(() => {
          let raf1;
          let raf2;
          const go = () => {
            raf1 = requestAnimationFrame(() => {
              raf2 = requestAnimationFrame(() => setLoaded(true));
            });
          };
          if (window.__preloaderDone) {
            go();
          } else {
            window.addEventListener('preloader:done', go, { once: true });
          }
          return () => {
            cancelAnimationFrame(raf1);
            cancelAnimationFrame(raf2);
            window.removeEventListener('preloader:done', go);
          };
        }, []);

        // Custom cursor: one lerped ring + one dot, cleaned up on unmount.
        useEffect(() => {
          const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
          if (reduceMotion || coarsePointer) return;

          const dot = document.querySelector('.cursor');
          const ring = document.querySelector('.cursor-ring');
          if (!dot || !ring) return;

          document.body.classList.add('has-cursor');

          let mx = window.innerWidth / 2;
          let my = window.innerHeight / 2;
          let rx = mx;
          let ry = my;
          let frame;

          const move = (e) => {
            mx = e.clientX;
            my = e.clientY;
            dot.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
          };

          let lastSurface = '';
          const loop = () => {
            rx += (mx - rx) * 0.16;
            ry += (my - ry) * 0.16;
            ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0)';
            const surface = surfaceAtY(my);
            if (surface !== lastSurface) {
              lastSurface = surface;
              dot.dataset.surface = surface;
              ring.dataset.surface = surface;
            }
            frame = requestAnimationFrame(loop);
          };

          const isInteractive = (target) =>
            target instanceof Element &&
            target.closest('a, button, input, select, textarea, .index-row, .method-row');

          const over = (e) => {
            if (isInteractive(e.target)) {
              dot.classList.add('is-hover');
              ring.classList.add('is-hover');
            }
          };

          const out = (e) => {
            if (isInteractive(e.target)) {
              dot.classList.remove('is-hover');
              ring.classList.remove('is-hover');
            }
          };

          window.addEventListener('mousemove', move, { passive: true });
          document.addEventListener('mouseover', over);
          document.addEventListener('mouseout', out);
          frame = requestAnimationFrame(loop);

          return () => {
            document.body.classList.remove('has-cursor');
            window.removeEventListener('mousemove', move);
            document.removeEventListener('mouseover', over);
            document.removeEventListener('mouseout', out);
            cancelAnimationFrame(frame);
          };
        }, []);

        // Scroll progress line in the header.
        useEffect(() => {
          const onScroll = () => {
            const doc = document.documentElement;
            const max = doc.scrollHeight - doc.clientHeight;
            const p = max > 0 ? Math.min(doc.scrollTop / max, 1) : 0;
            if (progressRef.current) {
              progressRef.current.style.transform = 'scaleX(' + p + ')';
            }
          };
          onScroll();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', onScroll);
          return () => {
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('resize', onScroll);
          };
        }, []);

        // Track which section owns the viewport.
        useEffect(() => {
          const els = SECTIONS.map((s) => document.getElementById(s.id)).filter(Boolean);
          if (!els.length || !('IntersectionObserver' in window)) return;
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) setActiveSection(entry.target.id);
              });
            },
            { rootMargin: '-45% 0px -45% 0px', threshold: 0 }
          );
          els.forEach((el) => io.observe(el));
          return () => io.disconnect();
        }, []);

        // The header and the bottom bar can sit over different sections, so
        // track the surface under each one and let their tokens flip.
        useEffect(() => {
          let frame = 0;
          const read = () => {
            frame = 0;
            const top = surfaceAtY(24);
            const bottom = surfaceAtY(window.innerHeight - 24);
            setSurface((prev) =>
              prev.top === top && prev.bottom === bottom ? prev : { top, bottom }
            );
          };
          const onScroll = () => {
            if (!frame) frame = requestAnimationFrame(read);
          };
          read();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', onScroll);
          return () => {
            cancelAnimationFrame(frame);
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('resize', onScroll);
          };
        }, [inverted]);

        // Reveal anything with [data-reveal] as it enters the viewport.
        useEffect(() => {
          const nodes = Array.from(document.querySelectorAll('[data-reveal]:not(.in)'));
          if (!nodes.length) return;
          if (!('IntersectionObserver' in window)) {
            nodes.forEach((n) => n.classList.add('in'));
            return;
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('in');
                  io.unobserve(entry.target);
                }
              });
            },
            { rootMargin: '0px 0px -10% 0px', threshold: 0.06 }
          );
          nodes.forEach((n) => io.observe(n));
          return () => io.disconnect();
        }, [students, scholarships, recommendations]);

        // Masked word rise: each display heading plays once when it enters the
        // viewport, then replays on hover. The hero is left to the loaded state
        // below so it never animates behind the preloader.
        useEffect(() => {
          const heads = Array.from(document.querySelectorAll('.split-head'));
          if (!heads.length) return;

          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            heads.forEach((el) => el.classList.add('is-in'));
            return;
          }

          const replay = (el) => {
            el.classList.remove('is-in');
            void el.offsetWidth;
            el.classList.add('is-in');
          };

          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('is-in');
                io.unobserve(entry.target);
              });
            },
            { threshold: 0.35 }
          );

          const cleanups = [];

          heads.forEach((el) => {
            if (el.dataset.split !== 'hero') io.observe(el);

            const words = el.querySelectorAll('.word-mask');
            if (!words.length) return;
            const last = words[words.length - 1].firstElementChild;

            // Hover replays, but only once the first play has settled.
            const onEnter = () => {
              if (el.dataset.ready === 'true') replay(el);
            };
            const onEnd = () => {
              el.dataset.ready = 'true';
            };
            el.addEventListener('mouseenter', onEnter);
            last.addEventListener('animationend', onEnd);
            cleanups.push(() => {
              el.removeEventListener('mouseenter', onEnter);
              last.removeEventListener('animationend', onEnd);
            });
          });

          return () => {
            io.disconnect();
            cleanups.forEach((fn) => fn());
          };
        }, []);

        // The hero heading starts when the preloader curtain lifts.
        useEffect(() => {
          if (!loaded) return;
          const hero = document.querySelector('.split-head[data-split="hero"]');
          if (hero) hero.classList.add('is-in');
        }, [loaded]);

        const fetchData = async () => {
          try {
            setError('');
            const [studentsRes, scholarshipsRes] = await Promise.all([
              fetch(`${API_BASE}/students`),
              fetch(`${API_BASE}/scholarships`)

            if (!studentsRes.ok || !scholarshipsRes.ok) {
              throw new Error(
                `Server responded with ${studentsRes.status} / ${scholarshipsRes.status}`
              );
            }

            const [studentsData, scholarshipsData] = await Promise.all([
              studentsRes.json(),
              scholarshipsRes.json()
            ]);

            setStudents(Array.isArray(studentsData) ? studentsData : []);
            setScholarships(Array.isArray(scholarshipsData) ? scholarshipsData : []);
          } catch (err) {
            console.error('Dashboard data fetch failed:', err);
            setError('Check the server connection and try again.');
          }
        };

        const handleCreateStudent = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');

          try {
            const res = await fetch(`${API_BASE}/students`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(newStudent)
            });

            if (res.ok) {
              setSuccess('Student created successfully');
              setNewStudent({
                phone: '',
                name: '',
                school: '',
                degree: '',
                year: 2024,
                annual_income: 0,
                category: 'GENERAL',
                disability_pct: 0

              fetchData();
            } else {
              setError('Failed to create student');
            }
          } catch (err) {
            setError('Error creating student');
          } finally {
            setLoading(false);
          }
        };

        const handleCreateScholarship = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');

          try {
            const res = await fetch(`${API_BASE}/scholarships`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(newScholarship)
            });

            if (res.ok) {
              setSuccess('Scholarship created successfully');
              setNewScholarship({
                name: '',
                org: '',
                category: 'CENTRAL_GENERAL',
                eligibility_criteria: '',
                deadline: '',
                documents: '',
                url: ''
              });
              fetchData();
            } else {
              setError('Failed to create scholarship');
            }
          } catch (err) {
            setError('Error creating scholarship');
          } finally {
            setLoading(false);
          }
        };

        const getRecommendations = async () => {
          if (!selectedStudent) {
            setError('Please select a student');
            return;
          }

          setLoading(true);
          setError('');
          setSuccess('');

          try {
            const res = await fetch(`${API_BASE}/students/${selectedStudent}/eligibility`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            });

            if (res.ok) {
              const data = await res.json();
              setRecommendations(data.matches || []);
              setSuccess('Recommendations generated');
            } else {
              setError('Failed to get recommendations');
            }
          } catch (err) {
            setError('Error getting recommendations');
          } finally {
            setLoading(false);
          }
        };

        const getScoreLabel = (score) => {
          if (score >= 70) return 'Strong match';
          if (score >= 40) return 'Partial match';
          return 'Low match';
        };

        const toggleInvert = useCallback(() => {
          setInverted((prev) => {
            const next = !prev;
            document.documentElement.dataset.invert = next ? 'true' : '';
            return next;
          });
        }, []);

        const scrollToId = (id) => {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        const marqueeWords = [
          'Eligibility',
          'Recommendation',
          'Verification',
          'Student profiles',
          'Scholarship index',
          'Matching engine'
        ];

        return (
          <div className={'app' + (loaded ? ' is-loaded' : '')}>
            <header className="site-header" data-surface={surface.top}>
              <div className="header-bar">
                <a
                  className="logo"
                  href="#overview"
                  onClick={(e) => {
                    e.preventDefault();
                    scrollToId('overview');
                  }}
                >
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <rect x="0.5" y="0.5" width="15" height="15" stroke="currentColor" />
                    <path d="M0.5 0.5L15.5 15.5" stroke="currentColor" />
                  </svg>
                  <span className="logo-text">
                    Scholarship<span> Eligibility</span>
                  </span>
                </a>

                <nav className="header-nav" aria-label="Sections">
                  {SECTIONS.map((s) => (
                    <a
                      key={s.id}
                      href={'#' + s.id}
                      onClick={(e) => {
                        e.preventDefault();
                        scrollToId(s.id);
                      }}
                    >
                      {s.label}
                    </a>
                  ))}
                </nav>

                <div className="header-right">
                  <span className="status" role="status" aria-live="polite">
                    <span className={'status-dot' + (error ? ' is-error' : '')} aria-hidden="true"></span>
                    <span>{error ? 'Offline' : 'Live'}</span>
                  </span>
                  <button type="button" className="header-action" onClick={fetchData}>
                    Refresh
                  </button>
                </div>
              </div>
              <div className="scroll-progress" ref={progressRef} aria-hidden="true"></div>
            </header>

            <main>
              <section className="hero" id="overview">
                <div className="hero-top hero-fade">
                  <p className="cap">Student &amp; scholarship management workspace</p>
                  <p className="cap hero-top-right">
                    {pad2(students.length)} students / {pad2(scholarships.length)} schemes
                  </p>
                </div>

                <div className="hero-mid">
                  <h1
                    className="display hero-tagline split-head"
                    data-split="hero"
                    aria-label="Find the right scholarship"
                  >
                    <span className="line-mask" style={{ '--d': 0 }}>
                      <span>
                        <span className="word-mask" style={{ '--i': 0 }} aria-hidden="true">
                          <span>Find</span>
                        </span>{' '}
                        <span className="word-mask" style={{ '--i': 1 }} aria-hidden="true">
                          <span>the</span>
                        </span>
                      </span>
                    </span>
                    <span className="line-mask" style={{ '--d': 1 }}>
                      <span>
                        <span className="word-mask" style={{ '--i': 2 }} aria-hidden="true">
                          <span>right</span>
                        </span>
                      </span>
                    </span>
                    <span className="line-mask" style={{ '--d': 2 }}>
                      <span>
                        <span className="word-mask" style={{ '--i': 3 }} aria-hidden="true">
                          <span>scholarship</span>
                        </span>
                      </span>
                    </span>
                  </h1>
                </div>

                <div className="hero-bottom hero-fade">
                  <p className="body-sm hero-desc">
                    Register a student profile, score every scheme against it, and read the
                    matches ranked by fit.
                  </p>
                  <div className="hero-actions">
                    <button
                      type="button"
                      className="btn-solid"
                      onClick={() => scrollToId('register')}
                    >
                      Register a student <i>↗</i>
                    </button>
                    <button
                      type="button"
                      className="btn-line"
                      onClick={() => scrollToId('match')}
                    >
                      Match a profile
                    </button>
                  </div>
                  <div className="scroll-cue" aria-hidden="true">
                    <span className="cap">Scroll</span>
                    <i></i>
                  </div>
                </div>
              </section>

              <div className="marquee" aria-hidden="true">
                <div className="marquee-track">
                  <div className="marquee-group">
                    {marqueeWords.map((w) => (
                      <span key={'a-' + w}>{w}</span>
                    ))}
                  </div>
                  <div className="marquee-group">
                    {marqueeWords.map((w) => (
                      <span key={'b-' + w}>{w}</span>
                    ))}
                  </div>
                </div>
              </div>

              {error && (
                <div className="alert" role="alert">
                  <div>
                    <strong>Notice</strong>
                    <div>{error}</div>
                  </div>
                  <button
                    type="button"
                    className="alert-close"
                    onClick={() => setError('')}
                  >
                    Dismiss
                  </button>
                </div>
              )}
              {success && (
                <div className="alert" role="status">
                  <div>
                    <strong>Confirmed</strong>
                    <div>{success}</div>
                  </div>
                  <button
                    type="button"
                    className="alert-close"
                    onClick={() => setSuccess('')}

                    Dismiss
                  </button>
                </div>
              )}

              <section className="numbers" aria-label="Dashboard statistics">
                <div className="numbers-grid">
                  <div className="number-cell">

                    <Counter value={students.length} />
                    <span className="number-desc">Profiles available for eligibility scoring.</span>
                  </div>
                  <div className="number-cell">
                    <span className="cap">Scholarships indexed</span>
                    <Counter value={scholarships.length} />
                    <span className="number-desc">Live records ready to be matched.</span>
                  </div>
                  <div className="number-cell">
                    <span className="cap">Recommendations</span>
                    <Counter value={recommendations.length} />
                    <span className="number-desc">Matches generated in this session.</span>
                  </div>
                </div>
              </section>

              <section className="method" aria-label="How matching works">
                {METHOD.map((m, i) => (
                  <div className="method-row" key={m.word} data-reveal style={{ '--i': i }}>
                    <span className="cap method-index">{pad2(i + 1)}</span>
                    <h3 className="method-word">{m.word}</h3>
                    <p className="method-text">{m.text}</p>
                  </div>
                ))}
              </section>
              <section className="section section--dark" id="index">
                <div className="section-head">
                  <div className="section-caption">
                    <span className="cap">
                      <b>02</b> — Scholarship index
                    </span>
                  </div>
                  <h2
                    className="h2 split-head"
                    aria-label="Every scheme, in one place."
                  >
                    <span className="word-mask" style={{ '--i': 0 }} aria-hidden="true">
                      <span>Every</span>
                    </span>{' '}
                    <span className="word-mask" style={{ '--i': 1 }} aria-hidden="true">
                      <span>scheme,</span>
                    </span>
                    <br />
                    <span className="word-mask" style={{ '--i': 2 }} aria-hidden="true">
                      <span>in</span>

                    <span className="word-mask" style={{ '--i': 3 }} aria-hidden="true">
                      <span>one</span>

                    <span className="word-mask" style={{ '--i': 4 }} aria-hidden="true">
                      <span>place.</span>

                    {scholarships.map((s, i) => (

                      >
                        <span className="cap index-num">{pad2(i + 1)}</span>
                        <h3 className="index-name">{s.name || 'Untitled scholarship'}</h3>

                        {s.url ? (

                            ↗

                <div className="index-foot">
                  <span className="cap">{pad2(scholarships.length)} records</span>
                  <span className="cap">Source: live API</span>

              </section>

              <section className="section" id="register">
                <div className="section-head">
                  <div className="section-caption">
                    <span className="cap">
                      <b>03</b> — Manage records

                  <h2 className="h2 split-head" aria-label="Add to the catalogue.">
                    <span className="word-mask" style={{ '--i': 0 }} aria-hidden="true">

                    </span>{' '}
                    <span className="word-mask" style={{ '--i': 1 }} aria-hidden="true">
                      <span>to</span>
                    </span>{' '}

                      <span>catalogue.</span>
                    </span>
                  </h2>
                  <p className="section-note">

                <div className="accordion">

                      <span className="acc-title">Register student</span>

                      <span className="acc-plus" aria-hidden="true">
                        <i></i>
                        <i></i>

                    <div className="acc-body" id="panel-student">

                                <input
