<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarship Eligibility Assistant - Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.5/babel.min.js"></script>
    <style>
      :root {
        --bg-primary: #08090B;
        --bg-secondary: #101114;
        --bg-card: #17181C;
        --bg-card-elevated: #202126;
        --text-primary: #F5F5F7;
        --text-secondary: #A0A1AA;
        --text-muted: #777983;
        --border: #2B2C32;
        --border-subtle: #24252A;
        --action-primary-bg: #F4F4F5;
        --action-primary-text: #111114;
        --action-secondary-bg: #292A30;
        --action-secondary-text: #F5F5F7;
        --success: #8DD8A5;
        --warning: #F2C879;
        --error: #F18A8A;
        --info: #A9B8FF;
        --radius-card: 24px;
        --radius-control: 12px;
        --radius-pill: 9999px;
        --space-xs: 8px;
        --space-sm: 12px;
        --space-md: 16px;
        --space-lg: 20px;
        --space-xl: 24px;
        --space-2xl: 32px;
        --space-3xl: 40px;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        background: var(--bg-primary);
        min-height: 100vh;
        color: var(--text-primary);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .app {
        min-height: 100vh;
        padding: var(--space-lg) var(--space-xl);
      }
      
      @media (max-width: 768px) {
        .app {
          padding: var(--space-md);
        }
      }
      
      .container {
        max-width: 1440px;
        margin: 0 auto;
      }
      
      .header {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-xl);
        margin-bottom: var(--space-2xl);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-lg);
        flex-wrap: wrap;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .header:hover {
        border-color: #33343A;
      }
      
      .header-left {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }
      
      .logo-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, var(--bg-card-elevated) 0%, var(--bg-card) 100%);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      
      .header-text h1 {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
        letter-spacing: -0.02em;
      }
      
      .header-text p {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 400;
      }
      
      .header-right {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }
      
      .status-indicator {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: var(--space-xs) var(--space-md);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 8px rgba(141, 216, 165, 0.6);
      }
      
      .btn-refresh {
        background: var(--action-secondary-bg);
        color: var(--action-secondary-text);
        border: 1px solid var(--border);
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-control);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      
      .btn-refresh:hover {
        background: #323338;
        border-color: #33343A;
      }
      
      .btn-refresh:focus-visible {
        outline: 2px solid var(--info);
        outline-offset: 2px;
      }
      
      .overview {
        margin-bottom: var(--space-2xl);
      }
      
      .overview-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: var(--space-xl);
      }
      
      @media (max-width: 968px) {
        .overview-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .overview-main {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .overview-main:hover {
        border-color: #33343A;
      }
      
      .overview-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: var(--space-sm);
      }
      
      .overview-main h2 {
        font-size: 36px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-md);
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      
      @media (max-width: 768px) {
        .overview-main h2 {
          font-size: 28px;
        }
      }
      
      .overview-main p {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: var(--space-xl);
        max-width: 540px;
      }
      
      .overview-sidebar {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-md);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .overview-sidebar:hover {
        border-color: #33343A;
      }
      
      .overview-sidebar-label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }
      
      .overview-sidebar-value {
        font-size: 48px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      
      @media (max-width: 768px) {
        .overview-sidebar-value {
          font-size: 36px;
        }
      }
      
      .overview-sidebar-desc {
        font-size: 12px;
        color: var(--text-secondary);
      }
      
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      
      @media (max-width: 1024px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .stat-card:hover {
        border-color: #33343A;
      }
      
      .stat-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: var(--space-md);
      }
      
      .stat-value {
        font-size: 56px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-sm);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      
      @media (max-width: 768px) {
        .stat-value {
          font-size: 42px;
        }
      }
      
      .stat-desc {
        font-size: 12px;
        color: var(--text-secondary);
      }
      
      .forms-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      
      @media (max-width: 1024px) {
        .forms-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: var(--space-2xl);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
        height: fit-content;
      }
      
      .card:hover {
        border-color: #33343A;
      }
      
      .card-header {
        margin-bottom: var(--space-xl);
      }
      
      .card-header h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-xs);
        letter-spacing: -0.01em;
      }
      
      .card-header p {
        font-size: 13px;
        color: var(--text-secondary);
      }
      
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
      }
      
      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }
      
      .form-group.full-width {
        grid-column: 1 / -1;
      }
      
      .form-group label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }
      
      .form-group input,
      .form-group select,
      .form-group textarea {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        width: 100%;
      }
      
      .form-group input:hover,
      .form-group select:hover,
      .form-group textarea:hover {
        border-color: #33343A;
      }
      
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--info);
        box-shadow: 0 0 0 3px rgba(169, 184, 255, 0.1);
      }
      
      .form-group textarea {
        resize: vertical;
        min-height: 80px;
        font-family: 'Inter', sans-serif;
      }
      
      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: var(--text-muted);
      }
      
      .btn-primary {
        background: var(--action-primary-bg);
        color: var(--action-primary-text);
        border: 1px solid var(--action-primary-bg);
        padding: 11px 20px;
        border-radius: var(--radius-control);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: opacity 0.2s ease, transform 0.2s ease;
        align-self: flex-start;
        margin-top: var(--space-md);
      }
      
      .btn-primary:hover:not(:disabled) {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      
      .btn-primary:active:not(:disabled) {
        transform: translateY(0);
      }
      
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      
      .btn-primary:focus-visible {
        outline: 2px solid var(--info);
        outline-offset: 2px;
      }
      
      .results-grid {
        display: grid;
        grid-template-columns: 4fr 8fr;
        gap: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      
      @media (max-width: 1024px) {
        .results-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .alert {
        padding: 12px 16px;
        border-radius: var(--radius-control);
        font-size: 13px;
        margin-bottom: var(--space-lg);
        border: 1px solid var(--border);
      }
      
      .alert-error {
        background: rgba(241, 138, 138, 0.1);
        color: var(--error);
        border-color: rgba(241, 138, 138, 0.3);
      }
      
      .alert-success {
        background: rgba(141, 216, 165, 0.1);
        color: var(--success);
        border-color: rgba(141, 216, 165, 0.3);
      }
      
      .scholarship-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        max-height: 500px;
        overflow-y: auto;
        padding-right: var(--space-xs);
      }
      
      .scholarship-list::-webkit-scrollbar {
        width: 8px;
      }
      
      .scholarship-list::-webkit-scrollbar-track {
        background: var(--bg-secondary);
        border-radius: var(--radius-control);
      }
      
      .scholarship-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: var(--radius-control);
      }
      
      .scholarship-item {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        padding: var(--space-lg);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      .scholarship-item:hover {
        border-color: #33343A;
      }
      
      .scholarship-item h3 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-xs);
        letter-spacing: -0.01em;
      }
      
      .scholarship-org {
        font-size: 13px;
        color: var(--info);
        margin-bottom: var(--space-sm);
        font-weight: 500;
      }
      
      .scholarship-meta {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      
      .scholarship-meta:last-of-type {
        margin-bottom: var(--space-sm);
      }
      
      .score-badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
      }
      
      .score-high {
        background: rgba(141, 216, 165, 0.1);
        color: var(--success);
        border-color: rgba(141, 216, 165, 0.3);
      }
      
      .score-medium {
        background: rgba(242, 200, 121, 0.1);
        color: var(--warning);
        border-color: rgba(242, 200, 121, 0.3);
      }
      
      .score-low {
        background: rgba(241, 138, 138, 0.1);
        color: var(--error);
        border-color: rgba(241, 138, 138, 0.3);
      }
      
      .empty-state {
        text-align: center;
        padding: var(--space-3xl);
        color: var(--text-muted);
        font-size: 13px;
      }
      
      .footer {
        margin-top: var(--space-3xl);
        padding-top: var(--space-xl);
        border-top: 1px solid var(--border-subtle);
        text-align: center;
      }
      
      .footer p {
        font-size: 11px;
        color: var(--text-muted);
      }
      
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [students, setStudents] = useState([]);
        const [scholarships, setScholarships] = useState([]);
        const [recommendations, setRecommendations] = useState([]);
        const [selectedStudent, setSelectedStudent] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        
        const [newStudent, setNewStudent] = useState({
          phone: '',
          name: '',
          school: '',
          degree: '',
          year: 2024,
          annual_income: 0,
          category: 'GENERAL',
          disability_pct: 0
        });

        const [newScholarship, setNewScholarship] = useState({
          name: '',
          org: '',
          category: 'CENTRAL_GENERAL',
          eligibility_criteria: '',
          deadline: '',
          documents: '',
          url: ''
        });

        useEffect(() => {
          fetchData();
        }, []);

        const fetchData = async () => {
          try {
            const [studentsRes, scholarshipsRes] = await Promise.all([
              fetch('http://localhost:3000/students'),
              fetch('http://localhost:3000/scholarships')
            ]);
            
            if (studentsRes.ok) {
              const data = await studentsRes.json();
              setStudents(data);
            }
            if (scholarshipsRes.ok) {
              const data = await scholarshipsRes.json();
              setScholarships(data);
            }
          } catch (err) {
            setError('Failed to fetch data');
          }
        };

        const handleCreateStudent = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');
          
          try {
            const res = await fetch('http://localhost:3000/students', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(newStudent)
            });
            
            if (res.ok) {
              setSuccess('Student created successfully');
              setNewStudent({
                phone: '',
                name: '',
                school: '',
                degree: '',
                year: 2024,
                annual_income: 0,
                category: 'GENERAL',
                disability_pct: 0
              });
              fetchData();
            } else {
              setError('Failed to create student');
            }
          } catch (err) {
            setError('Error creating student');
          } finally {
            setLoading(false);
          }
        };

        const handleCreateScholarship = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');
          
          try {
            const res = await fetch('http://localhost:3000/scholarships', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(newScholarship)
            });
            
            if (res.ok) {
              setSuccess('Scholarship created successfully');
              setNewScholarship({
                name: '',
                org: '',
                category: 'CENTRAL_GENERAL',
                eligibility_criteria: '',
                deadline: '',
                documents: '',
                url: ''
              });
              fetchData();
            } else {
              setError('Failed to create scholarship');
            }
          } catch (err) {
            setError('Error creating scholarship');
          } finally {
            setLoading(false);
          }
        };

        const getRecommendations = async () => {
          if (!selectedStudent) {
            setError('Please select a student');
            return;
          }
          
          setLoading(true);
          setError('');
          setSuccess('');
          
          try {
            const res = await fetch(`http://localhost:3000/students/${selectedStudent}/eligibility`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            });
            
            if (res.ok) {
              const data = await res.json();
              setRecommendations(data.matches || []);
              setSuccess('Recommendations generated');
            } else {
              setError('Failed to get recommendations');
            }
          } catch (err) {
            setError('Error getting recommendations');
          } finally {
            setLoading(false);
          }
        };

        const getScoreClass = (score) => {
          if (score >= 70) return 'high';
          if (score >= 40) return 'medium';
          return 'low';
        };

        const getScoreLabel = (score) => {
          if (score >= 70) return 'Good Match';
          if (score >= 40) return 'Partial Match';
          return 'Low Match';
        };

        return (
          <div className="container">
            <div className="header">
              <h1>🎓 Scholarship Eligibility Assistant</h1>
              <p>AI-driven scholarship recommendation platform</p>
            </div>

            {error && <div className="error">{error}</div>}
            {success && <div className="success">{success}</div>}

            <div className="stats">
              <div className="stat-card">
                <div className="number">{students.length}</div>
                <div className="label">Students Registered</div>
              </div>
              <div className="stat-card">
                <div className="number">{scholarships.length}</div>
                <div className="label">Scholarships Available</div>
              </div>
              <div className="stat-card">
                <div className="number">{recommendations.length}</div>
                <div className="label">Recommendations</div>
              </div>
            </div>

            <div className="main">
              <div className="card">
                <h2>👤 Register Student</h2>
                <form onSubmit={handleCreateStudent}>
                  <div className="form-group">
                    <label>Phone Number</label>
                    <input
                      type="text"
                      value={newStudent.phone}
                      onChange={(e) => setNewStudent({...newStudent, phone: e.target.value})}
                      required
                      placeholder="e.g., 9876543210"
                    />
                  </div>
                  <div className="form-group">
                    <label>Full Name</label>
                    <input
                      type="text"
                      value={newStudent.name}
                      onChange={(e) => setNewStudent({...newStudent, name: e.target.value})}
                      required
                      placeholder="e.g., Ravi Kumar"
                    />
                  </div>
                  <div className="form-group">
                    <label>School/College</label>
                    <input
                      type="text"
                      value={newStudent.school}
                      onChange={(e) => setNewStudent({...newStudent, school: e.target.value})}
                      placeholder="e.g., XYZ College"
                    />
                  </div>
                  <div className="form-group">
                    <label>Degree/Class</label>
                    <input
                      type="text"
                      value={newStudent.degree}
                      onChange={(e) => setNewStudent({...newStudent, degree: e.target.value})}
                      placeholder="e.g., B.Tech, 12th, 10th"
                    />
                  </div>
                  <div className="form-group">
                    <label>Year</label>
                    <input
                      type="number"
                      value={newStudent.year}
                      onChange={(e) => setNewStudent({...newStudent, year: parseInt(e.target.value)})}
                    />
                  </div>
                  <div className="form-group">
                    <label>Annual Income (₹)</label>
                    <input
                      type="number"
                      value={newStudent.annual_income}
                      onChange={(e) => setNewStudent({...newStudent, annual_income: parseFloat(e.target.value)})}
                    />
                  </div>
                  <div className="form-group">
                    <label>Category</label>
                    <select
                      value={newStudent.category}
                      onChange={(e) => setNewStudent({...newStudent, category: e.target.value})}
                    >
                      <option value="GENERAL">General</option>
                      <option value="GENERAL_GIRLS">General Girls</option>
                      <option value="SC">SC</option>
                      <option value="ST">ST</option>
                      <option value="OBC">OBC</option>
                      <option value="SOCIAL_SC">Social SC</option>
                      <option value="SOCIAL_PWD">PWD</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Disability Percentage (%)</label>
                    <input
                      type="number"
                      value={newStudent.disability_pct}
                      onChange={(e) => setNewStudent({...newStudent, disability_pct: parseInt(e.target.value)})}
                      min="0"
                      max="100"
                    />
                  </div>
                  <button type="submit" className="btn" disabled={loading}>
                    {loading ? 'Creating...' : 'Register Student'}
                  </button>
                </form>
              </div>

              <div className="card">
                <h2>🎓 Add Scholarship</h2>
                <form onSubmit={handleCreateScholarship}>
                  <div className="form-group">
                    <label>Scholarship Name</label>
                    <input
                      type="text"
                      value={newScholarship.name}
                      onChange={(e) => setNewScholarship({...newScholarship, name: e.target.value})}
                      required
                      placeholder="e.g., Central Sector Scheme"
                    />
                  </div>
                  <div className="form-group">
                    <label>Organization</label>
                    <input
                      type="text"
                      value={newScholarship.org}
                      onChange={(e) => setNewScholarship({...newScholarship, org: e.target.value})}
                      required
                      placeholder="e.g., MHRD / AICTE"
                    />
                  </div>
                  <div className="form-group">
                    <label>Category</label>
                    <select
                      value={newScholarship.category}
                      onChange={(e) => setNewScholarship({...newScholarship, category: e.target.value})}
                    >
                      <option value="CENTRAL_GENERAL">Central General</option>
                      <option value="STATE_GENERAL">State General</option>
                      <option value="GENERAL_GIRLS">General Girls</option>
                      <option value="SOCIAL_SC">Social SC</option>
                      <option value="SOCIAL_ST">Social ST</option>
                      <option value="SOCIAL_PWD">PWD</option>
                      <option value="SCIENCE_RESEARCH">Science Research</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Eligibility Criteria</label>
                    <textarea
                      value={newScholarship.eligibility_criteria}
                      onChange={(e) => setNewScholarship({...newScholarship, eligibility_criteria: e.target.value})}
                      rows="3"
                      placeholder="e.g., Class 12 pass. Min 80% aggregate. Family annual income < INR 4.5 lakh."
                    />
                  </div>
                  <div className="form-group">
                    <label>Deadline</label>
                    <input
                      type="date"
                      value={newScholarship.deadline}
                      onChange={(e) => setNewScholarship({...newScholarship, deadline: e.target.value})}
                    />
                  </div>
                  <div className="form-group">
                    <label>Documents Required</label>
                    <input
                      type="text"
                      value={newScholarship.documents}
                      onChange={(e) => setNewScholarship({...newScholarship, documents: e.target.value})}
                      placeholder="e.g., income_certificate, marksheets, etc."
                    />
                  </div>
                  <div className="form-group">
                    <label>Website URL</label>
                    <input
                      type="url"
                      value={newScholarship.url}
                      onChange={(e) => setNewScholarship({...newScholarship, url: e.target.value})}
                      placeholder="e.g., https://scholarships.gov.in"
                    />
                  </div>
                  <button type="submit" className="btn" disabled={loading}>
                    {loading ? 'Adding...' : 'Add Scholarship'}
                  </button>
                </form>
              </div>

              <div className="card">
                <h2>🔍 Get Eligibility Recommendations</h2>
                <div className="form-group">
                  <label>Select Student</label>
                  <select
                    value={selectedStudent}
                    onChange={(e) => setSelectedStudent(e.target.value)}
                  >
                    <option value="">-- Select Student --</option>
                    {students.map((s) => (
                      <option key={s.id} value={s.id}>
                        {s.name} ({s.phone})
                      </option>
                    ))}
                  </select>
                </div>
                <button onClick={getRecommendations} className="btn" disabled={loading || !selectedStudent}>
                  {loading ? 'Analyzing...' : 'Get Recommendations'}
                </button>
              </div>

              <div className="card">
                <h2>📋 Recommended Scholarships</h2>
                {recommendations.length === 0 ? (
                  <p style={{ color: '#666', textAlign: 'center', padding: '20px' }}>
                    No recommendations yet. Select a student and click Get Recommendations.
                  </p>
                ) : (
                  recommendations.map((rec, idx) => (
                    <div key={idx} className="scholarship-item">
                      <h3>{rec.details?.name}</h3>
                      <div className="org">{rec.details?.org}</div>
                      <div className="meta">Deadline: {rec.details?.deadline}</div>
                      <div className="meta">Category: {rec.details?.category}</div>
                      <div className="meta">{rec.details?.eligibility_criteria}</div>
                      <span className={`score ${getScoreClass(rec.score)}`}>
                        {rec.score}% - {getScoreLabel(rec.score)}
                      </span>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
